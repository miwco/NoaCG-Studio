<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - ALERT.
     A low breaking-news band with a severity chip, headline and standfirst on two stacked lines.
     The two copy lines are start-anchored inside one wide panel with room before the right safe
     margin, which is the shape that should propose growth without asking.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .al-chip { font-family: Inter; font-weight: 800; letter-spacing: 3px; }
      .al-headline { font-family: Archivo; font-weight: 700; }
      .al-standfirst { font-family: Inter; font-weight: 500; }
    </style>
  </defs>

  <g id="Alert_x20_panel" data-name="Alert panel">
    <rect x="110" y="756" width="1490" height="214" rx="10" fill="#0d1017" opacity="0.96"/>
    <rect x="110" y="756" width="12" height="214" fill="#b3372e"/>
    <rect x="154" y="792" width="210" height="54" rx="5" fill="#b3372e"/>
    <rect x="402" y="790" width="1148" height="3" fill="#b3372e"/>
  </g>

  <!-- These stacked, start-anchored lines share one wider-than-tall rectangle. This file wants
       the panel to grow to the right, then wrap into gained height, before type shrinks. -->
  <g id="Alert_x20_words" data-name="Alert words">
    <text id="Severity" class="al-chip" x="259" y="827" font-size="20" fill="#ffffff" text-anchor="middle">EMERGENCY</text>
    <text id="Headline" class="al-headline" x="402" y="858" font-size="48" fill="#ffffff">Storm warning issued for the coast</text>
    <text id="Standfirst" class="al-standfirst" x="402" y="914" font-size="28" fill="#b7bcc4">Ferries are suspended from 21.00 until conditions improve.</text>
  </g>
</svg>
