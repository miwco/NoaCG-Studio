<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - CORNER BUG.
     The artwork fills a small artboard instead of sitting in one corner of an empty HD frame.
     Importing it makes a free-floating object that the wizard's zone picker can place anywhere.
     The compact bug is the design, so this file wants shrink rather than growth.
     Small 320x120 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <style>
      .cb-mark { font-family: Archivo; font-weight: 800; letter-spacing: 2px; }
      .cb-live { font-family: Inter; font-weight: 700; letter-spacing: 3px; }
    </style>
  </defs>

  <g id="Bug_x20_panel" data-name="Bug panel">
    <rect x="4" y="4" width="312" height="112" rx="14" fill="#0d1017" opacity="0.94"/>
    <rect x="4" y="4" width="10" height="112" rx="5" fill="#f6a623"/>
    <circle cx="277" cy="30" r="9" fill="#f6a623"/>
  </g>

  <!-- The words stay centred in this compact object. This file wants shrink, not growth. -->
  <g id="Bug_x20_words" data-name="Bug words">
    <text id="Station" class="cb-mark" x="160" y="66" font-size="38" fill="#ffffff" text-anchor="middle">NORTH</text>
    <text id="Status" class="cb-live" x="160" y="94" font-size="16" fill="#b7bcc4" text-anchor="middle">LIVE</text>
  </g>
</svg>
