<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - PUBLIC INFORMATION.
     One full-frame notice carries separate Finnish and English headings and body lines.
     The layer names include FI and EN, so an operator can tell both language sets apart.
     The paired centred columns are the design, so this file wants shrink rather than growth.
     Full-frame 1920x1080 artboard, opaque #0d1017 background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .pi-heading { font-family: Sora; font-weight: 700; }
      .pi-body { font-family: Inter; font-weight: 500; }
    </style>
  </defs>

  <g id="Notice_x20_background" data-name="Notice background">
    <rect x="0" y="0" width="1920" height="1080" fill="#0d1017"/>
    <rect x="120" y="230" width="1680" height="620" rx="16" fill="#161b24"/>
    <rect x="120" y="230" width="1680" height="8" fill="#f6a623"/>
    <line x1="960" y1="360" x2="960" y2="790" stroke="#1e2530" stroke-width="3"/>
    <circle cx="960" cy="300" r="18" fill="#f6a623"/>
  </g>

  <!-- Each language is its own clearly named field set. The centred board stays fixed. -->
  <g id="Notice_x20_words" data-name="Notice words">
    <text id="Heading_x20_FI" data-name="Heading FI" class="pi-heading" x="540" y="470" font-size="52" fill="#ffffff" text-anchor="middle">Vesi on poikki</text>
    <!-- The notice in each language is ONE text object, so the operator gets one box per
         language rather than one per line (docs/SVG_AUTHORING.md section 3). The two languages
         ARE two objects, because they are two things to say and neither re-flows into the
         other - the same rule read the other way. -->
    <text id="Body_x20_FI" data-name="Body FI" class="pi-body" x="540" y="570" font-size="30" fill="#b7bcc4" text-anchor="middle"><tspan x="540" y="570">Huoltotyö alkaa kello 09.00.</tspan><tspan x="540" y="624">Vesi palaa viimeistään kello 14.00.</tspan></text>
    <text id="Heading_x20_EN" data-name="Heading EN" class="pi-heading" x="1380" y="470" font-size="52" fill="#ffffff" text-anchor="middle">Water interruption</text>
    <text id="Body_x20_EN" data-name="Body EN" class="pi-body" x="1380" y="570" font-size="30" fill="#b7bcc4" text-anchor="middle"><tspan x="1380" y="570">Maintenance begins at 09.00.</tspan><tspan x="1380" y="624">Service returns by 14.00.</tspan></text>
  </g>
</svg>
