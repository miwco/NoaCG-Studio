<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - TICKER.
     A full-width lower strip with a fixed amber tag, one live story line and a clock at the end.
     The strip already reaches both frame edges, so it has no room to grow and long copy shrinks.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .tk-story { font-family: Libre Franklin; font-weight: 600; }
      .tk-clock { font-family: JetBrains Mono; font-weight: 500; letter-spacing: 1px; }
    </style>
  </defs>

  <g id="Ticker_x20_strip" data-name="Ticker strip">
    <rect x="0" y="918" width="1920" height="162" fill="#0d1017" opacity="0.96"/>
    <rect x="0" y="918" width="246" height="162" fill="#f6a623"/>
    <rect x="246" y="918" width="8" height="162" fill="#1e2530"/>
    <rect x="1670" y="918" width="250" height="162" fill="#161b24"/>
  </g>

  <!-- The amber tag is furniture, not a field: its three ink bars remain fixed artwork. -->
  <g id="Kicker_x20_block" data-name="Kicker block" fill="#10131a">
    <rect x="78" y="966" width="90" height="8"/>
    <rect x="78" y="991" width="62" height="8"/>
    <rect x="78" y="1016" width="76" height="8"/>
  </g>

  <!-- This edge-to-edge strip wants shrink, not growth. -->
  <g id="Ticker_x20_copy" data-name="Ticker copy">
    <text id="Story" class="tk-story" x="310" y="1017" font-size="34" fill="#ffffff">City council approves the harbour renewal plan</text>
    <text id="Clock" class="tk-clock" x="1795" y="1017" font-size="28" fill="#f6a623" text-anchor="middle">20.45 EET</text>
  </g>
</svg>
