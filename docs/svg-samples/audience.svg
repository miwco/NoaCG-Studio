<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - AUDIENCE QUESTION.
     A viewer card carries an embedded avatar, a handle and two live question lines.
     The question lines are stacked and start-anchored inside one panel with clear room below,
     so wrapping can use the height the panel gains and growth should be proposed.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .au-handle { font-family: Inter; font-weight: 700; letter-spacing: 2px; }
      .au-question { font-family: Manrope; font-weight: 600; }
    </style>
    <clipPath id="Viewer_x20_avatar_x20_clip">
      <circle cx="500" cy="420" r="98"/>
    </clipPath>
  </defs>

  <g id="Question_x20_card" data-name="Question card">
    <rect x="300" y="220" width="1320" height="620" rx="18" fill="#0d1017" opacity="0.96"/>
    <rect x="300" y="220" width="12" height="620" fill="#f6a623"/>
    <circle cx="500" cy="420" r="112" fill="#161b24" stroke="#f6a623" stroke-width="6"/>
    <rect x="620" y="390" width="880" height="3" fill="#1e2530"/>
  </g>

  <!-- The embedded pixel is a real picture layer the operator can replace with an avatar. -->
  <image id="Viewer_x20_avatar" data-name="Viewer avatar" x="402" y="322" width="196" height="196"
         clip-path="url(#Viewer_x20_avatar_x20_clip)"
         href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII="/>

  <!-- These two question lines are start-anchored with empty vertical room below. This file
       wants the panel to grow to the right and gain height for wrapping before it shrinks. -->
  <g id="Question_x20_words" data-name="Question words">
    <text id="Viewer_x20_handle" data-name="Viewer handle" class="au-handle" x="620" y="350" font-size="24" fill="#f6a623">@northwatcher</text>
    <text id="Question_x20_line_x20_1" data-name="Question line 1" class="au-question" x="620" y="500" font-size="42" fill="#ffffff">How will the new tram line</text>
    <text id="Question_x20_line_x20_2" data-name="Question line 2" class="au-question" x="620" y="560" font-size="42" fill="#ffffff">change the morning commute?</text>
  </g>
</svg>
