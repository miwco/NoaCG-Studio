<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG import sample 1 of 3 - THE PLAIN HAPPY PATH.
     Full-frame artboard (1920x1080) with a transparent background, so the graphic lands on the
     canvas exactly where it is drawn here. Every headline is a real <text> layer, so the import
     binds the designer's own typography - nothing is redrawn. Layer names become field labels.
     See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .lt-name { font-family: Archivo; font-weight: 700; }
      .lt-meta { font-family: Inter; font-weight: 500; }
    </style>
  </defs>

  <g id="Panel">
    <rect x="140" y="760" width="1040" height="190" rx="8" fill="#0d1017" opacity="0.92"/>
    <rect x="140" y="760" width="10" height="190" fill="#f6a623"/>
  </g>

  <g id="Copy">
    <text id="Name" class="lt-name" x="190" y="840" font-size="56" fill="#ffffff">Alexandra Riva</text>
    <text id="Role" class="lt-meta" x="190" y="892" font-size="30" fill="#b7bcc4">Chief Correspondent</text>
    <text id="Location" class="lt-meta" x="190" y="932" font-size="22" fill="#7f8792" letter-spacing="2">HELSINKI</text>
  </g>
</svg>
