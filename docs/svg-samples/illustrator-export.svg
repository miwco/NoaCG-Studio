<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG import sample 4 of 4 - SHAPED THE WAY ILLUSTRATOR REALLY EXPORTS.
     Everything here is a habit of the exporter rather than a choice a designer made, and each
     one used to produce a wrong answer:
       font-family="Archivo-Bold"  -> a PostScript face name, not a family (now: Archivo at 700,
                                      declared under the name the artwork asks for)
       one tspan per KERNED RUN    -> the headline is ONE field, not three
       two labels on one baseline  -> still TWO fields; the gap between them is what says so
       layer names as ids          -> "Home_x20_team" reads as "Home team"; a repeated name is
                                      numbered rather than duplicated
       a hidden draft layer        -> not offered as a field for text nobody can see
     Drop it and every row should read the way a person would say it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .cls-name { font-family: Archivo-Bold; }
      .cls-meta { font-family: JetBrainsMono-Regular; }
    </style>
  </defs>

  <g id="Panel">
    <rect x="150" y="770" width="1000" height="180" rx="6" fill="#0d1017" opacity="0.94"/>
    <rect x="150" y="770" width="8" height="180" fill="#f6a623"/>
  </g>

  <!-- A KERNED headline: Illustrator writes one tspan per run when the type carries tracking.
       All three sit on one baseline, flush against each other - one line, one field. -->
  <g id="Name">
    <text class="cls-name" font-size="54" fill="#ffffff">
      <tspan x="200" y="848">A</tspan><tspan x="238" y="848">lexandra</tspan><tspan x="452" y="848"> Riva</tspan>
    </text>
  </g>

  <!-- A second layer with the SAME name. Both are offered; the second is numbered. -->
  <g id="Name" data-name="Name">
    <text class="cls-name" font-size="28" fill="#b7bcc4" x="200" y="896">Jonas Berg</text>
  </g>

  <!-- Two labels placed APART on one baseline: two fields, not one merged string. -->
  <text class="cls-meta" font-size="22" fill="#7f8792">
    <tspan id="Location" x="200" y="932">HELSINKI</tspan><tspan id="Slot" x="700" y="932">19:30</tspan>
  </text>

  <!-- A draft the designer switched off. Drawn nowhere, offered nowhere. -->
  <g id="Old_x20_draft" style="display:none">
    <text class="cls-meta" font-size="22" fill="#ffffff" x="200" y="700">Working title - do not air</text>
  </g>
</svg>
