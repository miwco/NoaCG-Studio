<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - ESPORTS SCOREBUG.
     A series bug carries two team names, a map score and three round pips with hidden won states.
     Each repeated state names its own map, so the behaviour binding arrives already filled in.
     The compact scoreboard layout is fixed, so this file wants shrink rather than growth.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .es-team { font-family: Big Shoulders; font-weight: 800; letter-spacing: 2px; }
      .es-score { font-family: Saira; font-weight: 700; }
    </style>
  </defs>

  <g id="Series_x20_bug" data-name="Series bug">
    <rect x="430" y="72" width="1060" height="174" rx="8" fill="#0d1017" opacity="0.96"/>
    <rect x="430" y="72" width="10" height="174" fill="#f6a623"/>
    <rect x="450" y="92" width="1020" height="72" rx="5" fill="#161b24"/>
    <rect x="450" y="174" width="1020" height="52" rx="5" fill="#1e2530"/>
    <circle cx="835" cy="200" r="13" fill="#7f8792"/>
    <circle cx="960" cy="200" r="13" fill="#7f8792"/>
    <circle cx="1085" cy="200" r="13" fill="#7f8792"/>
  </g>

  <!-- Repeated drawn states name the map they belong to. Both hidden idioms are valid. -->
  <g id="Map_x20_1_x20_won" data-name="Map 1 won" display="none">
    <circle cx="835" cy="200" r="17" fill="#f6a623"/>
    <circle cx="835" cy="200" r="7" fill="#10131a"/>
  </g>
  <g id="Map_x20_2_x20_won" data-name="Map 2 won" style="display:none">
    <circle cx="960" cy="200" r="17" fill="#f6a623"/>
    <circle cx="960" cy="200" r="7" fill="#10131a"/>
  </g>
  <g id="Map_x20_3_x20_won" data-name="Map 3 won" display="none">
    <circle cx="1085" cy="200" r="17" fill="#f6a623"/>
    <circle cx="1085" cy="200" r="7" fill="#10131a"/>
  </g>

  <!-- Team words and numeric scores paint last over the fixed series bug. -->
  <g id="Series_x20_words" data-name="Series words">
    <text id="Home_x20_team" data-name="Home team" class="es-team" x="500" y="143" font-size="42" fill="#ffffff">NOVA CREW</text>
    <text id="Home_x20_score" data-name="Home score" class="es-score" x="920" y="143" font-size="46" fill="#ffffff" text-anchor="end">2</text>
    <text id="Away_x20_score" data-name="Away score" class="es-score" x="1000" y="143" font-size="46" fill="#ffffff">1</text>
    <text id="Away_x20_team" data-name="Away team" class="es-team" x="1420" y="143" font-size="42" fill="#ffffff" text-anchor="end">ARCTIC FOXES</text>
  </g>
</svg>
