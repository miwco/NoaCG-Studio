<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - INFO CARD.
     A half-screen card with five live text layers and an embedded picture beside the copy.
     The centred lines make the card's layout the design, so a long answer should shrink rather
     than grow the panel.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .ic-kicker { font-family: Inter; font-weight: 700; letter-spacing: 4px; }
      .ic-headline { font-family: Archivo; font-weight: 700; }
      .ic-body { font-family: Inter; font-weight: 500; }
    </style>
  </defs>

  <g id="Card">
    <rect x="170" y="190" width="1580" height="700" rx="18" fill="#0d1017" opacity="0.96"/>
    <rect x="170" y="190" width="1580" height="8" rx="4" fill="#f6a623"/>
    <rect x="1015" y="250" width="650" height="560" rx="12" fill="#161b24"/>
    <rect x="1015" y="250" width="650" height="560" rx="12" fill="none" stroke="#1e2530" stroke-width="3"/>
  </g>

  <!-- The embedded pixel keeps this a real picture layer while the sample stays small. -->
  <image id="Card_x20_picture" data-name="Card picture" x="1050" y="285" width="580" height="490"
         href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII="/>

  <!-- The words are centred inside a fixed composition. This file wants shrink, not growth. -->
  <g id="Card_x20_copy" data-name="Card copy">
    <text id="Kicker" class="ic-kicker" x="592" y="324" font-size="22" fill="#f6a623" text-anchor="middle">FIELD NOTES</text>
    <text id="Headline" class="ic-headline" x="592" y="430" font-size="64" fill="#ffffff" text-anchor="middle">Northern lights</text>
    <text id="Body_x20_line_x20_1" data-name="Body line 1" class="ic-body" x="592" y="545" font-size="30" fill="#b7bcc4" text-anchor="middle">A clear sky opens above</text>
    <text id="Body_x20_line_x20_2" data-name="Body line 2" class="ic-body" x="592" y="595" font-size="30" fill="#b7bcc4" text-anchor="middle">the islands after midnight</text>
    <text id="Body_x20_line_x20_3" data-name="Body line 3" class="ic-body" x="592" y="645" font-size="30" fill="#b7bcc4" text-anchor="middle">with strong aurora expected.</text>
  </g>
</svg>
