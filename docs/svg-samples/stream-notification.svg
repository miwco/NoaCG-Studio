<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - STREAM NOTIFICATION.
     A compact toast carries an embedded icon plus live event-kind and viewer-name layers.
     The same floating object can serve follows, gifts and raids because both words are fields.
     Its centred compact layout is fixed, so this file wants shrink rather than growth.
     Small 520x140 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <style>
      .sn-event { font-family: Inter; font-weight: 700; letter-spacing: 3px; }
      .sn-name { font-family: Sora; font-weight: 700; }
    </style>
    <clipPath id="Event_x20_icon_x20_clip">
      <circle cx="76" cy="70" r="32"/>
    </clipPath>
  </defs>

  <g id="Toast_x20_panel" data-name="Toast panel">
    <rect x="4" y="4" width="512" height="132" rx="16" fill="#0d1017" opacity="0.96"/>
    <rect x="4" y="4" width="10" height="132" rx="5" fill="#f6a623"/>
    <circle cx="76" cy="70" r="42" fill="#161b24" stroke="#f6a623" stroke-width="4"/>
  </g>

  <!-- The transparent pixel keeps the icon replaceable without adding file size. -->
  <image id="Event_x20_icon" data-name="Event icon" x="44" y="38" width="64" height="64"
         clip-path="url(#Event_x20_icon_x20_clip)"
         href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII="/>

  <!-- Both variable lines are centred in the toast. The small object does not grow. -->
  <g id="Toast_x20_words" data-name="Toast words">
    <text id="Event_x20_kind" data-name="Event kind" class="sn-event" x="315" y="58" font-size="18" fill="#f6a623" text-anchor="middle">NEW FOLLOWER</text>
    <text id="Viewer_x20_name" data-name="Viewer name" class="sn-name" x="315" y="101" font-size="30" fill="#ffffff" text-anchor="middle">mika_live</text>
  </g>
</svg>
