<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - CAMERA FRAME.
     A bordered webcam surround leaves a real transparent window and carries a name strap below.
     The centre is cut out with the even-odd fill rule, never covered by a white rectangle, so
     the camera remains visible through it.
     The centred name strap is fixed, so this file wants shrink rather than growth.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .fr-name { font-family: Space Grotesk; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- The second subpath is a hole. Even-odd filling keeps the webcam area transparent. -->
  <g id="Camera_x20_surround" data-name="Camera surround">
    <path d="M90 60 H1830 V980 H90 Z M160 120 H1760 V820 H160 Z" fill="#0d1017" fill-rule="evenodd" opacity="0.96"/>
    <rect x="160" y="120" width="1600" height="700" fill="none" stroke="#f6a623" stroke-width="8"/>
    <path d="M160 120 H330 L160 290 Z" fill="#f6a623"/>
    <path d="M1760 650 V820 H1590 Z" fill="#1e2530"/>
    <rect x="610" y="844" width="700" height="102" rx="8" fill="#161b24"/>
    <rect x="610" y="844" width="10" height="102" fill="#f6a623"/>
  </g>

  <!-- The strap is centred under the camera window and does not grow. -->
  <text id="Guest_x20_name" data-name="Guest name" class="fr-name" x="960" y="912" font-size="42" fill="#ffffff" text-anchor="middle">MARA VOSS</text>
</svg>
