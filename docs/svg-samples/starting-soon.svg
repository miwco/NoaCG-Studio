<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - STARTING SOON.
     A full-frame holding screen with a show title, a status line and one clock-shaped sample.
     The clock row can become a countdown whose operator field is the length in minutes.
     The centred holding-screen layout is fixed, so this file wants shrink rather than growth.
     Full-frame 1920x1080 artboard, opaque #0d1017 background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .ss-title { font-family: Space Grotesk; font-weight: 700; }
      .ss-label { font-family: Inter; font-weight: 700; letter-spacing: 8px; }
      .ss-clock { font-family: JetBrains Mono; font-weight: 500; }
    </style>
  </defs>

  <g id="Holding_x20_screen" data-name="Holding screen">
    <rect x="0" y="0" width="1920" height="1080" fill="#0d1017"/>
    <circle cx="960" cy="540" r="310" fill="none" stroke="#1e2530" stroke-width="2"/>
    <circle cx="960" cy="540" r="286" fill="none" stroke="#161b24" stroke-width="28"/>
    <path d="M960 226 A314 314 0 0 1 1260 448" fill="none" stroke="#f6a623" stroke-width="8" stroke-linecap="round"/>
    <rect x="760" y="738" width="400" height="4" fill="#f6a623"/>
  </g>

  <!-- Only this clock-shaped layer offers the countdown choice in this file. -->
  <g id="Holding_x20_words" data-name="Holding words">
    <text id="Show_x20_title" data-name="Show title" class="ss-title" x="960" y="405" font-size="64" fill="#ffffff" text-anchor="middle">NIGHT SIGNAL</text>
    <text id="Status" class="ss-label" x="960" y="500" font-size="24" fill="#b7bcc4" text-anchor="middle">STARTING SOON</text>
    <text id="Countdown" class="ss-clock" x="960" y="650" font-size="110" fill="#f6a623" text-anchor="middle">05:00</text>
  </g>
</svg>
