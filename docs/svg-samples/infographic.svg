<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - INFOGRAPHIC.
     Four horizontal bars pair a live label with a plain figure that proposes a number field.
     The bars behind the values are artwork, so an operator edits the figures but not bar length.
     Shared baselines and end-anchored values make this chart fixed, so it wants no growth.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .ig-title { font-family: Archivo; font-weight: 700; letter-spacing: 3px; }
      .ig-source { font-family: Inter; font-weight: 500; letter-spacing: 2px; }
      .ig-label { font-family: Manrope; font-weight: 600; }
      .ig-value { font-family: JetBrains Mono; font-weight: 700; }
    </style>
  </defs>

  <g id="Chart_x20_panel" data-name="Chart panel">
    <rect x="260" y="150" width="1400" height="720" rx="14" fill="#0d1017" opacity="0.95"/>
    <rect x="260" y="150" width="10" height="720" fill="#f6a623"/>
  </g>

  <!-- The amber lengths are drawn data-visualization furniture, not operator fields. -->
  <g id="Bars">
    <rect x="630" y="280" width="830" height="68" rx="6" fill="#1e2530"/>
    <rect x="630" y="280" width="830" height="68" rx="6" fill="#f6a623" opacity="0.92"/>
    <rect x="630" y="430" width="830" height="68" rx="6" fill="#1e2530"/>
    <rect x="630" y="430" width="613" height="68" rx="6" fill="#f6a623" opacity="0.82"/>
    <rect x="630" y="580" width="830" height="68" rx="6" fill="#1e2530"/>
    <rect x="630" y="580" width="356" height="68" rx="6" fill="#f6a623" opacity="0.72"/>
    <rect x="630" y="730" width="830" height="68" rx="6" fill="#1e2530"/>
    <rect x="630" y="730" width="178" height="68" rx="6" fill="#f6a623" opacity="0.62"/>
  </g>

  <!-- Labels and figures share baselines, so the chart layout holds and does not grow. The
       title and the source sit on one baseline for the same reason: a headline alone above a
       chart would read as a strap the panel should widen for, and this panel must not move. -->
  <g id="Chart_x20_words" data-name="Chart words">
    <text id="Chart_x20_title" data-name="Chart title" class="ig-title" x="340" y="232" font-size="34" fill="#ffffff">WHERE THE BUDGET GOES</text>
    <text id="Chart_x20_source" data-name="Chart source" class="ig-source" x="1560" y="232" font-size="20" fill="#7f8792" text-anchor="end">CITY BUDGET 2027</text>
    <text id="Bar_x20_1_x20_label" data-name="Bar 1 label" class="ig-label" x="340" y="328" font-size="30" fill="#ffffff">Transit</text>
    <text id="Bar_x20_1_x20_value" data-name="Bar 1 value" class="ig-value" x="1560" y="330" font-size="36" fill="#ffffff" text-anchor="end">42</text>
    <text id="Bar_x20_2_x20_label" data-name="Bar 2 label" class="ig-label" x="340" y="478" font-size="30" fill="#ffffff">Housing</text>
    <text id="Bar_x20_2_x20_value" data-name="Bar 2 value" class="ig-value" x="1560" y="480" font-size="36" fill="#ffffff" text-anchor="end">31</text>
    <text id="Bar_x20_3_x20_label" data-name="Bar 3 label" class="ig-label" x="340" y="628" font-size="30" fill="#ffffff">Parks</text>
    <text id="Bar_x20_3_x20_value" data-name="Bar 3 value" class="ig-value" x="1560" y="630" font-size="36" fill="#ffffff" text-anchor="end">18</text>
    <text id="Bar_x20_4_x20_label" data-name="Bar 4 label" class="ig-label" x="340" y="778" font-size="30" fill="#ffffff">Other</text>
    <text id="Bar_x20_4_x20_value" data-name="Bar 4 value" class="ig-value" x="1560" y="780" font-size="36" fill="#ffffff" text-anchor="end">9</text>
  </g>
</svg>
