<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - MATCH-UP.
     Two competitor rows carry names and records, with one switched-off pick state drawn per row.
     A hidden drawn state is offered to the behaviour picker precisely because its layer is off.
     The two-row board is the design, so this file wants shrink rather than growth.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .mu-name { font-family: Saira; font-weight: 700; }
      .mu-record { font-family: JetBrains Mono; font-weight: 500; }
    </style>
  </defs>

  <g id="Matchup_x20_board" data-name="Matchup board">
    <rect x="320" y="260" width="1280" height="560" rx="14" fill="#0d1017" opacity="0.96"/>
    <rect x="370" y="340" width="1180" height="150" rx="8" fill="#161b24"/>
    <rect x="370" y="590" width="1180" height="150" rx="8" fill="#161b24"/>
    <rect x="320" y="260" width="1280" height="8" fill="#f6a623"/>
  </g>

  <!-- Illustrator's attribute form: this picked-row drawing is switched off in the design app. -->
  <g id="Home_x20_pick" data-name="Home pick" display="none">
    <rect x="370" y="340" width="1180" height="150" rx="8" fill="#1e2530" stroke="#f6a623" stroke-width="5"/>
    <path d="M370 340 H410 L450 415 L410 490 H370 Z" fill="#f6a623"/>
  </g>

  <!-- Figma and Inkscape often write the same switched-off state as an inline style. -->
  <g id="Away_x20_pick" data-name="Away pick" style="display:none">
    <rect x="370" y="590" width="1180" height="150" rx="8" fill="#1e2530" stroke="#f6a623" stroke-width="5"/>
    <path d="M370 590 H410 L450 665 L410 740 H370 Z" fill="#f6a623"/>
  </g>

  <!-- The words paint last, above either pick state. The fixed board does not grow. -->
  <g id="Matchup_x20_words" data-name="Matchup words">
    <text id="Home_x20_competitor" data-name="Home competitor" class="mu-name" x="470" y="434" font-size="52" fill="#ffffff">MARA VOSS</text>
    <text id="Home_x20_record" data-name="Home record" class="mu-record" x="1460" y="430" font-size="34" fill="#b7bcc4" text-anchor="end">12 - 3</text>
    <text id="Away_x20_competitor" data-name="Away competitor" class="mu-name" x="470" y="684" font-size="52" fill="#ffffff">ELI NORTH</text>
    <text id="Away_x20_record" data-name="Away record" class="mu-record" x="1460" y="680" font-size="34" fill="#b7bcc4" text-anchor="end">10 - 5</text>
  </g>
</svg>
