<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG import sample 3 of 3 - OUTLINED TEXT (the fallback road).
     The headline was converted to outlines, the way "Create Outlines" / "Flatten" leaves a file.
     There is no <text> to bind, so the mapping step offers the glyph group as an OUTLINE row:
     ticking it HIDES the drawing (it stays in the file) and places a real editable line over its
     measured box. The subtitle beside it is still live <text>, so one file shows both roads.
     Full-frame 1920x1080, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .tc-sub { font-family: Inter; font-weight: 500; letter-spacing: 6px; }
    </style>
  </defs>

  <g id="Backdrop">
    <rect x="0" y="0" width="1920" height="1080" fill="#0d1017" opacity="0.9"/>
    <rect x="687" y="600" width="536" height="6" fill="#f6a623"/>
  </g>

  <!-- OUTLINED HEADLINE: five glyph paths, no text node. This is what the import can only
       stand a field in FRONT of - it can never edit these letters in place. -->
  <g id="Headline" fill="#ffffff">
    <path d="M687,360 H713 V520 H687 Z M687,360 H767 V386 H687 Z M687,430 H753 V456 H687 Z"/>
    <path d="M801,360 H827 V520 H801 Z"/>
    <path d="M915,360 H941 V520 H915 Z M979,360 H1005 V520 H979 Z M941,360 L967,360 L1005,520 L979,520 Z"/>
    <path d="M1061,360 L1087,360 L1119,520 L1093,520 L1074,425 L1055,520 L1029,520 Z M1051,455 H1097 V481 H1051 Z"/>
    <path d="M1143,360 H1169 V494 H1223 V520 H1143 Z"/>
  </g>

  <!-- LIVE TEXT, in the same file: this one binds in place and keeps its own typography. -->
  <text id="Subtitle" class="tc-sub" x="960" y="672" font-size="26" fill="#b7bcc4" text-anchor="middle">FULL TIME · HELSINKI</text>
</svg>
