<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - LIVE VOTE.
     Four option rows pair live labels with plain percentage figures and drawn bar lengths.
     The figures become number fields; bar length stays artwork an operator never has to type.
     Hidden open and closed badges show two complete states the designer supplied.
     The centred poll board is the design, so this file wants shrink rather than growth.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .pl-title { font-family: Sora; font-weight: 700; }
      .pl-option { font-family: Inter; font-weight: 600; }
      .pl-value { font-family: JetBrains Mono; font-weight: 700; }
      .pl-badge { font-family: Inter; font-weight: 800; letter-spacing: 3px; }
    </style>
  </defs>

  <g id="Poll_x20_board" data-name="Poll board">
    <rect x="300" y="120" width="1320" height="840" rx="14" fill="#0d1017" opacity="0.96"/>
    <rect x="300" y="120" width="1320" height="8" fill="#f6a623"/>
    <rect x="420" y="330" width="1080" height="86" rx="7" fill="#1e2530"/>
    <rect x="420" y="470" width="1080" height="86" rx="7" fill="#1e2530"/>
    <rect x="420" y="610" width="1080" height="86" rx="7" fill="#1e2530"/>
    <rect x="420" y="750" width="1080" height="86" rx="7" fill="#1e2530"/>
  </g>

  <!-- The amber lengths are drawn results, separate from the numeric fields. -->
  <g id="Vote_x20_bars" data-name="Vote bars">
    <rect x="760" y="365" width="560" height="16" rx="8" fill="#161b24"/>
    <rect x="760" y="365" width="213" height="16" rx="8" fill="#f6a623" opacity="0.88"/>
    <rect x="760" y="505" width="560" height="16" rx="8" fill="#161b24"/>
    <rect x="760" y="505" width="151" height="16" rx="8" fill="#f6a623" opacity="0.76"/>
    <rect x="760" y="645" width="560" height="16" rx="8" fill="#161b24"/>
    <rect x="760" y="645" width="118" height="16" rx="8" fill="#f6a623" opacity="0.66"/>
    <rect x="760" y="785" width="560" height="16" rx="8" fill="#161b24"/>
    <rect x="760" y="785" width="78" height="16" rx="8" fill="#f6a623" opacity="0.56"/>
  </g>

  <!-- These badge layers are switched off and offered as drawn behaviour states. -->
  <g id="Voting_x20_open" data-name="Voting open" display="none">
    <rect x="1250" y="174" width="250" height="58" rx="29" fill="#0f7a4a"/>
    <text class="pl-badge" x="1375" y="211" font-size="20" fill="#ffffff" text-anchor="middle">VOTING OPEN</text>
  </g>
  <g id="Voting_x20_closed" data-name="Voting closed" style="display:none">
    <rect x="1250" y="174" width="250" height="58" rx="29" fill="#b3372e"/>
    <text class="pl-badge" x="1375" y="211" font-size="20" fill="#ffffff" text-anchor="middle">VOTING CLOSED</text>
  </g>

  <!-- All editable words and figures paint last. The board layout does not grow. -->
  <g id="Poll_x20_words" data-name="Poll words">
    <text id="Poll_x20_title" data-name="Poll title" class="pl-title" x="960" y="235" font-size="56" fill="#ffffff" text-anchor="middle">Which story should lead?</text>
    <text id="Option_x20_1" data-name="Option 1" class="pl-option" x="470" y="385" font-size="30" fill="#ffffff">Local transport</text>
    <text id="Percent_x20_1" data-name="Percent 1" class="pl-value" x="1435" y="386" font-size="34" fill="#ffffff" text-anchor="end">38</text>
    <text id="Option_x20_2" data-name="Option 2" class="pl-option" x="470" y="525" font-size="30" fill="#ffffff">Housing costs</text>
    <text id="Percent_x20_2" data-name="Percent 2" class="pl-value" x="1435" y="526" font-size="34" fill="#ffffff" text-anchor="end">27</text>
    <text id="Option_x20_3" data-name="Option 3" class="pl-option" x="470" y="665" font-size="30" fill="#ffffff">Weekend weather</text>
    <text id="Percent_x20_3" data-name="Percent 3" class="pl-value" x="1435" y="666" font-size="34" fill="#ffffff" text-anchor="end">21</text>
    <text id="Option_x20_4" data-name="Option 4" class="pl-option" x="470" y="805" font-size="30" fill="#ffffff">Culture guide</text>
    <text id="Percent_x20_4" data-name="Percent 4" class="pl-value" x="1435" y="806" font-size="34" fill="#ffffff" text-anchor="end">14</text>
  </g>
</svg>
