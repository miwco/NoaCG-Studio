<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG import sample - A QUIZ BOARD WITH DRAWN STATES.
     Shaped the way Illustrator exports, and drawn the way the quiz behaviour expects
     (docs/GRAPHIC_BEHAVIOUR_PLAN.md, model L2): the DESIGNER draws what each moment looks
     like, NoaCG decides when each one is visible.

     The base look           -> the panel, the question, four answer rows.
     "A selected" and co.    -> what the pick looks like on that row. Hidden here, because the
                                designer wants to see their base artwork while drawing.
     "A correct" / "A wrong" -> the verdict on that row.
     "Locked in"             -> a board-level badge for the locked state.

     Every drawn state is OPTIONAL. Import this file, bind two answers and no state layers at
     all, and the board still selects, locks and reveals - it just shows nothing extra while it
     does. Draw them one at a time and each moment starts landing.

     Full-frame 1920x1080, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .qz-q { font-family: Archivo; font-weight: 700; }
      .qz-a { font-family: Inter; font-weight: 500; }
      .qz-badge { font-family: Archivo; font-weight: 700; letter-spacing: 4px; }
    </style>
  </defs>

  <g id="Board">
    <rect x="360" y="240" width="1200" height="112" rx="8" fill="#0d1017" opacity="0.94"/>
    <rect x="360" y="240" width="10" height="112" fill="#f6a623"/>
    <text id="Question" data-name="Question" class="qz-q" x="404" y="312" font-size="44" fill="#ffffff">Which city hosts the 2032 Olympics?</text>
  </g>

  <!-- The four answer PANELS. The words themselves are the last thing in the file (see the
       bottom): a drawn state has to paint under the text it decorates, and SVG stacks in
       document order. -->
  <g id="Row_x20_A">
    <rect x="360" y="392" width="1200" height="96" rx="6" fill="#161b24"/>
  </g>
  <g id="Row_x20_B">
    <rect x="360" y="504" width="1200" height="96" rx="6" fill="#161b24"/>
  </g>
  <g id="Row_x20_C">
    <rect x="360" y="616" width="1200" height="96" rx="6" fill="#161b24"/>
  </g>
  <g id="Row_x20_D">
    <rect x="360" y="728" width="1200" height="96" rx="6" fill="#161b24"/>
  </g>

  <!-- THE PICK, drawn once per row: an amber rail and a lifted panel. Hidden with the
       attribute form Illustrator writes when you click the eye off. -->
  <g id="A_x20_selected" data-name="A selected" display="none">
    <rect x="360" y="392" width="1200" height="96" rx="6" fill="#1e2530"/>
    <rect x="360" y="392" width="10" height="96" fill="#f6a623"/>
  </g>
  <g id="B_x20_selected" data-name="B selected" display="none">
    <rect x="360" y="504" width="1200" height="96" rx="6" fill="#1e2530"/>
    <rect x="360" y="504" width="10" height="96" fill="#f6a623"/>
  </g>
  <g id="C_x20_selected" data-name="C selected" display="none">
    <rect x="360" y="616" width="1200" height="96" rx="6" fill="#1e2530"/>
    <rect x="360" y="616" width="10" height="96" fill="#f6a623"/>
  </g>
  <g id="D_x20_selected" data-name="D selected" display="none">
    <rect x="360" y="728" width="1200" height="96" rx="6" fill="#1e2530"/>
    <rect x="360" y="728" width="10" height="96" fill="#f6a623"/>
  </g>

  <!-- THE VERDICT. "correct" lights the row; "wrong" veils it. The style form of hiding here,
       which is what Figma and Inkscape tend to write - both are read. -->
  <g id="A_x20_correct" data-name="A correct" style="display:none">
    <rect x="360" y="392" width="1200" height="96" rx="6" fill="#0f7a4a"/>
  </g>
  <g id="B_x20_correct" data-name="B correct" style="display:none">
    <rect x="360" y="504" width="1200" height="96" rx="6" fill="#0f7a4a"/>
  </g>
  <g id="C_x20_correct" data-name="C correct" style="display:none">
    <rect x="360" y="616" width="1200" height="96" rx="6" fill="#0f7a4a"/>
  </g>
  <g id="D_x20_correct" data-name="D correct" style="display:none">
    <rect x="360" y="728" width="1200" height="96" rx="6" fill="#0f7a4a"/>
  </g>

  <g id="A_x20_wrong" data-name="A wrong" style="display:none">
    <rect x="360" y="392" width="1200" height="96" rx="6" fill="#0d1017" opacity="0.72"/>
  </g>
  <g id="B_x20_wrong" data-name="B wrong" style="display:none">
    <rect x="360" y="504" width="1200" height="96" rx="6" fill="#0d1017" opacity="0.72"/>
  </g>
  <g id="C_x20_wrong" data-name="C wrong" style="display:none">
    <rect x="360" y="616" width="1200" height="96" rx="6" fill="#0d1017" opacity="0.72"/>
  </g>
  <g id="D_x20_wrong" data-name="D wrong" style="display:none">
    <rect x="360" y="728" width="1200" height="96" rx="6" fill="#0d1017" opacity="0.72"/>
  </g>

  <!-- THE LOCK, drawn once for the whole board rather than per row. -->
  <g id="Locked_x20_in" data-name="Locked in" display="none">
    <rect x="1320" y="240" width="240" height="52" rx="4" fill="#f6a623"/>
    <text class="qz-badge" x="1440" y="276" font-size="22" fill="#10131a" text-anchor="middle">LOCKED IN</text>
  </g>

  <!-- THE WORDS LAST. SVG has no z-index - paint order IS stack order - so every drawn state
       above sits UNDER the answer text. Draw a highlight after the text and it covers the word
       it is highlighting, which is the one mistake this file exists to not teach. -->
  <g id="Answers" data-name="Answers">
    <text id="Answer_x20_A" data-name="Answer A" class="qz-a" x="404" y="452" font-size="34" fill="#e8ebf0">Brisbane</text>
    <text id="Answer_x20_B" data-name="Answer B" class="qz-a" x="404" y="564" font-size="34" fill="#e8ebf0">Doha</text>
    <text id="Answer_x20_C" data-name="Answer C" class="qz-a" x="404" y="676" font-size="34" fill="#e8ebf0">Santiago</text>
    <text id="Answer_x20_D" data-name="Answer D" class="qz-a" x="404" y="788" font-size="34" fill="#e8ebf0">Budapest</text>
  </g>
</svg>
