<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - GAME-SHOW TIMER.
     A centred countdown readout sits inside a ring of drawn furniture with a round label below.
     Its middle anchor says the readout is composed against the centre and must not make the
     artwork grow when the value changes.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .gt-clock { font-family: Saira; font-weight: 700; }
      .gt-label { font-family: Saira; font-weight: 700; letter-spacing: 5px; }
    </style>
  </defs>

  <g id="Timer_x20_ring" data-name="Timer ring">
    <circle cx="960" cy="500" r="255" fill="#0d1017" opacity="0.96"/>
    <circle cx="960" cy="500" r="255" fill="none" stroke="#1e2530" stroke-width="28"/>
    <circle cx="960" cy="500" r="224" fill="none" stroke="#161b24" stroke-width="4"/>
    <path d="M960 245 A255 255 0 0 1 1198 410" fill="none" stroke="#f6a623" stroke-width="18" stroke-linecap="round"/>
    <circle cx="960" cy="500" r="15" fill="#f6a623"/>
    <rect x="810" y="786" width="300" height="76" rx="38" fill="#f6a623"/>
  </g>

  <!-- Both lines are middle-anchored. This timer wants shrink, not growth. -->
  <g id="Timer_x20_words" data-name="Timer words">
    <text id="Game_x20_clock" data-name="Game clock" class="gt-clock" x="960" y="545" font-size="126" fill="#ffffff" text-anchor="middle">00:30</text>
    <text id="Round_x20_label" data-name="Round label" class="gt-label" x="960" y="835" font-size="24" fill="#10131a" text-anchor="middle">ROUND 03</text>
  </g>
</svg>
