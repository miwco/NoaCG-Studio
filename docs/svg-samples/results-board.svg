<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - RESULTS BOARD.
     A header and six ranked rows expose position, name and points as systematic live fields.
     Names such as Row 1 name and Row 1 points keep a large operator mapping understandable.
     A switched-off Leader layer draws the top-row highlight below the words it decorates.
     The centred table is the design, so this file wants shrink rather than growth.
     Full-frame 1920x1080 artboard, opaque #0d1017 background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .rb-header { font-family: Inter; font-weight: 700; letter-spacing: 4px; }
      .rb-position { font-family: JetBrains Mono; font-weight: 700; }
      .rb-name { font-family: Manrope; font-weight: 600; }
      .rb-points { font-family: JetBrains Mono; font-weight: 600; }
    </style>
  </defs>

  <g id="Results_x20_background" data-name="Results background">
    <rect x="0" y="0" width="1920" height="1080" fill="#0d1017"/>
    <rect x="270" y="110" width="1380" height="860" rx="12" fill="#161b24"/>
    <rect x="270" y="110" width="1380" height="8" fill="#f6a623"/>
    <rect x="310" y="172" width="1300" height="74" fill="#1e2530"/>
  </g>

  <g id="Result_x20_rows" data-name="Result rows">
    <rect x="310" y="266" width="1300" height="96" fill="#0d1017"/>
    <rect x="310" y="374" width="1300" height="96" fill="#1e2530"/>
    <rect x="310" y="482" width="1300" height="96" fill="#0d1017"/>
    <rect x="310" y="590" width="1300" height="96" fill="#1e2530"/>
    <rect x="310" y="698" width="1300" height="96" fill="#0d1017"/>
    <rect x="310" y="806" width="1300" height="96" fill="#1e2530"/>
  </g>

  <!-- The leader highlight is artwork the designer drew and switched off. -->
  <g id="Leader" style="display:none">
    <rect x="310" y="266" width="1300" height="96" fill="#1e2530" stroke="#f6a623" stroke-width="5"/>
    <rect x="310" y="266" width="12" height="96" fill="#f6a623"/>
  </g>

  <!-- All table words paint after the hidden leader state. Each row uses systematic names. -->
  <g id="Results_x20_words" data-name="Results words">
    <text id="Header_x20_position" data-name="Header position" class="rb-header" x="380" y="220" font-size="22" fill="#b7bcc4">POS</text>
    <text id="Header_x20_name" data-name="Header name" class="rb-header" x="540" y="220" font-size="22" fill="#b7bcc4">COMPETITOR</text>
    <text id="Header_x20_points" data-name="Header points" class="rb-header" x="1530" y="220" font-size="22" fill="#b7bcc4" text-anchor="end">PTS</text>
    <text id="Row_x20_1_x20_position" data-name="Row 1 position" class="rb-position" x="390" y="327" font-size="30" fill="#ffffff">1</text>
    <text id="Row_x20_1_x20_name" data-name="Row 1 name" class="rb-name" x="540" y="327" font-size="30" fill="#ffffff">Mara Voss</text>
    <text id="Row_x20_1_x20_points" data-name="Row 1 points" class="rb-points" x="1530" y="327" font-size="30" fill="#ffffff" text-anchor="end">96</text>
    <text id="Row_x20_2_x20_position" data-name="Row 2 position" class="rb-position" x="390" y="435" font-size="30" fill="#ffffff">2</text>
    <text id="Row_x20_2_x20_name" data-name="Row 2 name" class="rb-name" x="540" y="435" font-size="30" fill="#ffffff">Eli North</text>
    <text id="Row_x20_2_x20_points" data-name="Row 2 points" class="rb-points" x="1530" y="435" font-size="30" fill="#ffffff" text-anchor="end">88</text>
    <text id="Row_x20_3_x20_position" data-name="Row 3 position" class="rb-position" x="390" y="543" font-size="30" fill="#ffffff">3</text>
    <text id="Row_x20_3_x20_name" data-name="Row 3 name" class="rb-name" x="540" y="543" font-size="30" fill="#ffffff">Noel Kivi</text>
    <text id="Row_x20_3_x20_points" data-name="Row 3 points" class="rb-points" x="1530" y="543" font-size="30" fill="#ffffff" text-anchor="end">81</text>
    <text id="Row_x20_4_x20_position" data-name="Row 4 position" class="rb-position" x="390" y="651" font-size="30" fill="#ffffff">4</text>
    <text id="Row_x20_4_x20_name" data-name="Row 4 name" class="rb-name" x="540" y="651" font-size="30" fill="#ffffff">Ina Berg</text>
    <text id="Row_x20_4_x20_points" data-name="Row 4 points" class="rb-points" x="1530" y="651" font-size="30" fill="#ffffff" text-anchor="end">73</text>
    <text id="Row_x20_5_x20_position" data-name="Row 5 position" class="rb-position" x="390" y="759" font-size="30" fill="#ffffff">5</text>
    <text id="Row_x20_5_x20_name" data-name="Row 5 name" class="rb-name" x="540" y="759" font-size="30" fill="#ffffff">Otto Lehto</text>
    <text id="Row_x20_5_x20_points" data-name="Row 5 points" class="rb-points" x="1530" y="759" font-size="30" fill="#ffffff" text-anchor="end">69</text>
    <text id="Row_x20_6_x20_position" data-name="Row 6 position" class="rb-position" x="390" y="867" font-size="30" fill="#ffffff">6</text>
    <text id="Row_x20_6_x20_name" data-name="Row 6 name" class="rb-name" x="540" y="867" font-size="30" fill="#ffffff">Jonas Vale</text>
    <text id="Row_x20_6_x20_points" data-name="Row 6 points" class="rb-points" x="1530" y="867" font-size="30" fill="#ffffff" text-anchor="end">61</text>
  </g>
</svg>
