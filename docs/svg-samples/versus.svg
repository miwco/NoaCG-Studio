<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - VERSUS CARD.
     Two competitors face a centred VS with an embedded crest layer on each side and a strap below.
     One name ends at the centre and the other starts there, so the composed layout must hold.
     The opposing anchors make this file want shrink rather than growth.
     Full-frame 1920x1080 artboard, opaque #0d1017 background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .vs-team { font-family: Big Shoulders; font-weight: 800; letter-spacing: 2px; }
      .vs-mark { font-family: Big Shoulders; font-weight: 800; }
      .vs-strap { font-family: Inter; font-weight: 600; letter-spacing: 4px; }
    </style>
    <clipPath id="Home_x20_crest_x20_clip">
      <circle cx="560" cy="450" r="130"/>
    </clipPath>
    <clipPath id="Away_x20_crest_x20_clip">
      <circle cx="1360" cy="450" r="130"/>
    </clipPath>
  </defs>

  <g id="Versus_x20_background" data-name="Versus background">
    <rect x="0" y="0" width="1920" height="1080" fill="#0d1017"/>
    <path d="M0 0 H910 L760 1080 H0 Z" fill="#161b24"/>
    <path d="M1920 0 H1010 L1160 1080 H1920 Z" fill="#1e2530"/>
    <rect x="956" y="180" width="8" height="720" fill="#f6a623"/>
    <circle cx="560" cy="450" r="158" fill="#1e2530" stroke="#7f8792" stroke-width="3"/>
    <circle cx="1360" cy="450" r="158" fill="#161b24" stroke="#7f8792" stroke-width="3"/>
    <rect x="560" y="815" width="800" height="74" rx="37" fill="#f6a623"/>
  </g>

  <!-- Embedded transparent pixels stand in for crest artwork the operator can replace. -->
  <image id="Home_x20_crest" data-name="Home crest" x="430" y="320" width="260" height="260"
         clip-path="url(#Home_x20_crest_x20_clip)"
         href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII="/>
  <image id="Away_x20_crest" data-name="Away crest" x="1230" y="320" width="260" height="260"
         clip-path="url(#Away_x20_crest_x20_clip)"
         href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII="/>

  <!-- The names are composed against the middle. This card wants shrink, not growth. -->
  <g id="Versus_x20_words" data-name="Versus words">
    <text id="Home_x20_name" data-name="Home name" class="vs-team" x="860" y="720" font-size="76" fill="#ffffff" text-anchor="end">ARCTIC FOXES</text>
    <text id="Versus" class="vs-mark" x="960" y="722" font-size="66" fill="#f6a623" text-anchor="middle">VS</text>
    <text id="Away_x20_name" data-name="Away name" class="vs-team" x="1060" y="720" font-size="76" fill="#ffffff">NOVA CREW</text>
    <text id="Match_x20_strap" data-name="Match strap" class="vs-strap" x="960" y="862" font-size="24" fill="#10131a" text-anchor="middle">SEMIFINAL · BEST OF FIVE</text>
  </g>
</svg>
