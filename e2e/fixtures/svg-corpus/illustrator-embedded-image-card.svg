	<rect x="190" y="720" class="st1" width="10" height="220"/>
	<image id="Guest_x20_photo" data-name="Guest photo" x="230" y="750" width="160" height="160" overflow="visible" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="/>
	<text id="Guest_x20_name" data-name="Guest name" transform="matrix(1 0 0 1 430 812)" class="st2 st3 st4">Aino Virtanen</text>
	<text id="Guest_x20_role" data-name="Guest role" transform="matrix(1 0 0 1 430 872)" class="st5 st6 st7 st8">Author, Helsinki</text>
