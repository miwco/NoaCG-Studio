<?xml version="1.0" encoding="utf-8"?>
<!-- NoaCG SVG corpus / family "illustrator".
     Exporter: Adobe Illustrator 2024 (28.6) - Export As > SVG, Styling: Internal CSS,
     Images: EMBED (docs/SVG_AUTHORING.md §6 asks for exactly this).
     What they drew: the same guest card as figma-embedded-raster-card - a photo, a name and a
     role - but drawn in Illustrator instead. Illustrator embeds a placed picture the way the
     SVG spec describes it: a POSITIONED <image> element with x, y, width, height and a data:
     URI, standing where it is drawn.
     This file is the CONTROL for the Figma one, which produces the same design as a
     <rect fill="url(#pattern0)"> whose pattern <use>s an <image> parked in <defs>. Same
     designer, same intent, same promise in §3 - "<image> with an embedded picture becomes a
     picture field; the operator swaps it, and clearing the field restores the drawing you
     shipped" - and two exporters. If only one of them offers a picture row, the difference is
     the exporter's byte habits and nothing the designer did. -->
<!-- Generator: Adobe Illustrator 28.6.0, SVG Export Plug-In . SVG Version: 6.00 Build 0)  -->
