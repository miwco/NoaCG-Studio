	 viewBox="0 0 1920 1080" width="1920" height="1080" style="enable-background:new 0 0 1920 1080;"
	 xml:space="preserve">
<style type="text/css">
	.st0{fill:#0D1017;}
	.st1{fill:#F6A623;}
