<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG corpus / family "geometry".
     Exporter: Sketch 100 (sketchtool export), then hand-edited for a website.
     What they drew: a sponsor strap that already lived on the department's web page. To make it
     scale in the page, whoever put it there replaced Sketch's width="1920px" height="1080px"
     with width="100%" height="100%" and added preserveAspectRatio="xMidYMid meet" - the standard
     "responsive SVG" edit every front-end article recommends. The viewBox is untouched and is
     the only thing in the file that still states a real size.
     docs/SVG_AUTHORING.md rule 1: "A viewBox (or width+height) is required - it is the design
     space every field position is measured against." A percentage is not a size, so the viewBox
     is the answer here and 1920 x 1080 is what the door should report. -->
<svg width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Sponsor strap</title>
    <desc>Created with Sketch.</desc>
    <g id="Sponsor-strap" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="Strap-plate" fill="#0D1017" fill-opacity="0.92" x="0" y="960" width="1920" height="88"></rect>
        <rect id="Accent" fill="#F6A623" x="0" y="960" width="1920" height="4"></rect>
        <text id="Kicker" font-family="Archivo-Bold, Archivo" font-size="22" font-weight="bold" letter-spacing="4" fill="#F6A623">
            <tspan x="120" y="1000">IN PARTNERSHIP WITH</tspan>
        </text>
        <text id="Partner" font-family="Inter-Medium, Inter" font-size="30" font-weight="normal" fill="#FFFFFF">
            <tspan x="480" y="1002">Helsinki City Library</tspan>
        </text>
    </g>
</svg>
