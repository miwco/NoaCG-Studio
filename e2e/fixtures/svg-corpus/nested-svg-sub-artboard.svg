<?xml version="1.0" encoding="utf-8"?>
<!-- Adobe Illustrator 2024 (28.2) - File > Save As > SVG, SVG 1.1, Object IDs: Layer Names,
     Fonts: SVG, CSS Properties: Style Elements. The designer drew a full-frame ELECTION BUMPER
     card and placed the channel's own ident file on it; the ident was embedded rather than
     linked, so Illustrator writes it as a NESTED <svg> carrying its own 720x256 viewBox and
     placed at half size inside the 1920x1080 page. Both the outer card copy and the ident's own
     two lines are live text the designer expects to drive.
     Illustrator tells: the Generator comment, version/id="Layer_1", x="0px" y="0px",
     style="enable-background:new ..." on the root, xml:space="preserve", the .stN stylesheet,
     matrix(1 0 0 1 tx ty) on every <text> instead of x/y, PostScript face names in
     font-family, overflow="visible" on placed content, tab indentation and the attribute
     continuation line under the opening <svg>. -->
<!-- Generator: Adobe Illustrator 28.2.0, SVG Export Plug-In . SVG Version: 6.00 Build 0)  -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 1920 1080" style="enable-background:new 0 0 1920 1080;" xml:space="preserve">
<style type="text/css">
	.st0{fill:#0D1017;}
	.st1{fill:#F6A623;}
	.st2{fill:#FFFFFF;}
	.st3{fill:#B7BCC4;}
	.st4{font-family:'Archivo-Bold';}
	.st5{font-family:'Inter-Medium';}
	.st6{font-size:72px;}
	.st7{font-size:28px;}
	.st8{font-size:44px;}
	.st9{font-size:20px;letter-spacing:4;}
</style>
<g id="Card">
	<rect class="st0" width="1920" height="1080"/>
	<rect x="240" y="470" class="st1" width="120" height="8"/>
</g>
<g id="Copy">
	<text id="Headline" transform="matrix(1 0 0 1 240 420)" class="st2 st4 st6">Election night results</text>
	<text id="Timestamp" transform="matrix(1 0 0 1 240 560)" class="st3 st5 st7">Updated 22:40 EET</text>
</g>
<g id="Ident">
	<svg x="1440px" y="72px" width="360px" height="128px" viewBox="0 0 720 256" overflow="visible" xml:space="preserve">
		<rect class="st1" width="720" height="256"/>
		<text id="Channel" transform="matrix(1 0 0 1 48 130)" class="st0 st4 st8">NEWS 24</text>
		<text id="Strap" transform="matrix(1 0 0 1 48 196)" class="st0 st5 st9">LIVE COVERAGE</text>
	</svg>
</g>
</svg>
