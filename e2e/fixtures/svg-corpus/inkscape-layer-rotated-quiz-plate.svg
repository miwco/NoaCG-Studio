<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- NoaCG SVG corpus / family "inkscape".
     Exporter: Inkscape 1.3, Plain SVG (the layer structure kept, ids kept).
     What they drew: the same shape as the owner's own quiz board - a plate drawn PORTRAIT and
     turned flat, because that is what happens when you draw a tall box and rotate it - but with
     the rotation where Inkscape puts it, on the LAYER GROUP rather than on the rect. The rect
     inside carries no transform of its own at all; the text carries the counter-rotation so the
     words read level. Figma writes the same shape the same way for a rotated frame.
     docs/SVG_AUTHORING.md §4: "the panel gets wider" is a promise about the painted band, so the
     runtime has to convert its grant into the units the rect is DRAWN in - and those units live
     one level up here, in a frame turned 89.5 degrees, where the x axis of the screen is very
     nearly the y axis of the drawing. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <rect id="Backdrop" width="1920" height="1080" fill="#0D1017"/>
  <g id="layer1" inkscape:groupmode="layer" inkscape:label="Question band" transform="translate(960,700) rotate(-89.5)">
    <rect id="Plate" x="-90" y="-620" width="180" height="1240" fill="#12161F"/>
    <text id="Question" transform="rotate(89.5)" x="-540" y="14" font-family="Inter" font-size="40" font-weight="600" fill="#F2F4F8">Mika on Suomen korkein tunturi?</text>
  </g>
</svg>
