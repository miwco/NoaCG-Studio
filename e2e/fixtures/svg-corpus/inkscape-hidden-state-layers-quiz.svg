<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- NoaCG SVG corpus / family "inkscape".
     Exporter: Inkscape 1.3 (0e150ed6c4, 2023-07-21), File > Save As... > Inkscape SVG.
     What they drew: a quiz board for a school general-knowledge show, following
     docs/SVG_AUTHORING.md §5b - the base look, then one layer per moment (a picked row, a right
     row, a wrong row, and one "Locked in" stamp for the whole board), each with the eye clicked
     off so they could keep seeing their own artwork.
     The point of this file is HOW Inkscape writes an eye clicked off: style="display:none" in
     the element's own style attribute, not a class rule in a <style> block, which is the only
     shape the corpus had (Illustrator's class="st12"). One layer is switched off the other way
     the same attribute allows, visibility:hidden, which is what the XML editor leaves behind.
     Two of the hidden layers carry TEXT: "LOCKED IN" and "+1". §3 says a layer that is switched
     off is drawn but never offered as a field - an operator field for words nobody can see is
     worse than no field - while §5b says those same layers ARE what the quiz behaviour binds. -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.0.dtd"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="1920"
   height="1080"
   viewBox="0 0 1920 1080"
   version="1.1"
   id="svg1"
   inkscape:version="1.3 (0e150ed6c4, 2023-07-21)"
   sodipodi:docname="tietokilpailu.svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     inkscape:pageopacity="0.0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:document-units="px"
     showgrid="false"
     inkscape:current-layer="layer1" />
  <defs
     id="defs1" />
  <g
     inkscape:label="Board"
     inkscape:groupmode="layer"
     id="layer1">
    <rect
       style="fill:#0d1017;fill-opacity:0.96"
       id="rect1"
       width="1920"
       height="1080"
       x="0"
       y="0" />
    <rect
       style="fill:#161b24"
       id="rect2"
       width="1200"
       height="120"
       x="360"
       y="220" />
    <rect
       style="fill:#1b2130"
       id="rect3"
       width="1200"
       height="96"
       x="360"
       y="420" />
    <rect
       style="fill:#1b2130"
       id="rect4"
       width="1200"
       height="96"
       x="360"
       y="546" />
    <rect
       style="fill:#1b2130"
       id="rect5"
       width="1200"
       height="96"
       x="360"
       y="672" />
    <rect
       style="fill:#1b2130"
       id="rect6"
       width="1200"
       height="96"
       x="360"
       y="798" />
    <g
       inkscape:label="A picked"
       inkscape:groupmode="layer"
       id="layer-a-picked"
       style="display:none">
      <rect
         style="fill:#f6a623;fill-opacity:0.18"
         id="rect7"
         width="1200"
         height="96"
         x="360"
         y="420" />
      <rect
         style="fill:#f6a623"
         id="rect8"
         width="8"
         height="96"
         x="360"
         y="420" />
    </g>
    <g
       inkscape:label="B correct"
       inkscape:groupmode="layer"
       id="layer-b-correct"
       style="display:none">
      <rect
         style="fill:#2f9e5b"
         id="rect9"
         width="1200"
         height="96"
         x="360"
         y="546" />
    </g>
    <g
       inkscape:label="A wrong"
       inkscape:groupmode="layer"
       id="layer-a-wrong"
       style="display:none">
      <rect
         style="fill:#a8323c"
         id="rect10"
         width="1200"
         height="96"
         x="360"
         y="420" />
    </g>
    <g
       inkscape:label="Locked in"
       inkscape:groupmode="layer"
       id="layer-locked"
       style="display:none">
      <rect
         style="fill:#f6a623"
         id="rect11"
         width="260"
         height="52"
         x="1300"
         y="140" />
      <text
         xml:space="preserve"
         style="font-style:normal;font-weight:bold;font-size:26px;font-family:Archivo;-inkscape-font-specification:'Archivo Bold';letter-spacing:2px;fill:#0d1017"
         x="1330"
         y="176"
         id="text-locked"
         inkscape:label="Locked stamp"><tspan
           sodipodi:role="line"
           id="tspan-locked"
           x="1330"
           y="176">LOCKED IN</tspan></text>
    </g>
    <g
       inkscape:label="Point awarded"
       inkscape:groupmode="layer"
       id="layer-point"
       style="visibility:hidden">
      <text
         xml:space="preserve"
         style="font-style:normal;font-weight:bold;font-size:44px;font-family:Archivo;-inkscape-font-specification:'Archivo Bold';fill:#2f9e5b"
         x="1600"
         y="580"
         id="text-point"
         inkscape:label="Point stamp"><tspan
           sodipodi:role="line"
           id="tspan-point"
           x="1600"
           y="580">+1</tspan></text>
    </g>
    <text
       xml:space="preserve"
       style="font-style:normal;font-weight:bold;font-size:52px;font-family:Archivo;-inkscape-font-specification:'Archivo Bold';fill:#ffffff"
       x="400"
       y="298"
       id="text-q"
       inkscape:label="Question"><tspan
         sodipodi:role="line"
         id="tspan-q"
         x="400"
         y="298">Mikä on Suomen pisin joki?</tspan></text>
    <text
       xml:space="preserve"
       style="font-style:normal;font-weight:normal;font-size:38px;font-family:Inter;-inkscape-font-specification:'Inter Medium';fill:#e6e8ec"
       x="400"
       y="482"
       id="text-a"
       inkscape:label="Answer A"><tspan
         sodipodi:role="line"
         id="tspan-a"
         x="400"
         y="482">Kemijoki</tspan></text>
    <text
       xml:space="preserve"
       style="font-style:normal;font-weight:normal;font-size:38px;font-family:Inter;-inkscape-font-specification:'Inter Medium';fill:#e6e8ec"
       x="400"
       y="608"
       id="text-b"
       inkscape:label="Answer B"><tspan
         sodipodi:role="line"
         id="tspan-b"
         x="400"
         y="608">Tornionjoki</tspan></text>
    <text
       xml:space="preserve"
       style="font-style:normal;font-weight:normal;font-size:38px;font-family:Inter;-inkscape-font-specification:'Inter Medium';fill:#e6e8ec"
       x="400"
       y="734"
       id="text-c"
       inkscape:label="Answer C"><tspan
         sodipodi:role="line"
         id="tspan-c"
         x="400"
         y="734">Oulujoki</tspan></text>
    <text
       xml:space="preserve"
       style="font-style:normal;font-weight:normal;font-size:38px;font-family:Inter;-inkscape-font-specification:'Inter Medium';fill:#e6e8ec"
       x="400"
       y="860"
       id="text-d"
       inkscape:label="Answer D"><tspan
         sodipodi:role="line"
         id="tspan-d"
         x="400"
         y="860">Iijoki</tspan></text>
  </g>
</svg>
