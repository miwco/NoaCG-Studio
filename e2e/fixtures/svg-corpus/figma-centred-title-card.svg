<!-- NoaCG SVG corpus / family "figma".
     Exporter: Figma (desktop, 2024) - Export > SVG, Include "id" attribute ON, Outline text OFF.
     What they drew: the opening title card of a student documentary. Everything is CENTRE
     aligned on the frame's vertical midline - the eyebrow, the title, the rule and the credit -
     which is how a title card is always built and how nothing else in the corpus is built. A
     centre-aligned Figma text layer exports as text-anchor="middle" with the tspan's x sitting
     at the CENTRE of the line rather than at its left edge, so every coordinate in the file is
     the middle of something.
     docs/SVG_AUTHORING.md §3: each <text> becomes one bindable field, and §4's growth is
     described for a line that widens to the RIGHT - a centred card's layout is the design, the
     way a board's is. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_77_310)">
<rect width="1920" height="1080" fill="#0D1017"/>
<g id="Card">
<rect id="Plate" x="360" y="380" width="1200" height="320" fill="#12161F"/>
<text id="Eyebrow" fill="#F6A623" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="24" font-weight="500" letter-spacing="0.24em" text-anchor="middle"><tspan x="960" y="468.409">A STUDENT DOCUMENTARY</tspan></text>
<text id="Title" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="92" font-weight="bold" letter-spacing="-0.01em" text-anchor="middle"><tspan x="960" y="570.818">The Long Winter</tspan></text>
<rect id="Rule" x="860" y="606" width="200" height="2" fill="#2A2F3A"/>
<text id="Credit" fill="#B7BCC4" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="26" font-weight="500" text-anchor="middle"><tspan x="960" y="663.955">Directed by Aino Virtanen</tspan></text>
</g>
</g>
<defs>
<clipPath id="clip0_77_310">
<rect width="1920" height="1080" fill="white"/>
</clipPath>
</defs>
</svg>
