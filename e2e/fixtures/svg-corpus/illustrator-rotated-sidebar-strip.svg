     Exporter: Adobe Illustrator 2024 (28.6) - Export As > SVG, Styling: Internal CSS,
     Object IDs: Layer Names.
     What they drew: the furniture for a live results programme - a vertical strip down the left
     edge with the programme name reading bottom-to-top, and a corner clock block the designer
     scaled down to 70% after drawing it at full size.
     Illustrator never writes rotate() or scale(): every transform comes out as a MATRIX, so the
     vertical line is <text transform="matrix(0 -1 1 0 ...)"> - a matrix with zeros on the
     diagonal - and the shrunken block is a group carrying matrix(0.7 0 0 0.7 ...) with its
     children still drawn at their original size inside it. No drawn coordinate in either is its
     position on screen, and neither line's width runs along the x axis.
     docs/SVG_AUTHORING.md §3: every <text> becomes one field, labelled from its layer. -->
