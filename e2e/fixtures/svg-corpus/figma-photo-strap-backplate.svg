<!-- Figma (desktop, 2024 export engine) - Export > SVG, ids ON, text live. The frame itself was
     left with no fill so the strap sits over live video.
     The designer drew a name strap and dropped a photograph INTO THE STRAP ITSELF - the
     backplate is the picture, with the name and the role set on top of it, and a thin amber tab
     down its left edge. That is an ordinary full-bleed card: the shape a reader would swap the
     photo on is the same shape the name has to be able to widen.
     Figma NEVER writes a placed image as a positioned <image> - it fills the shape with a
     <pattern>, and the pattern <use>s an <image> parked at the bottom of <defs> carrying the
     base64 payload. The scale() maps the pixel size into the pattern's objectBoundingBox units
     (2px source -> scale(0.5)). The picture is a 2x2 PNG so the fixture stays small. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<g clip-path="url(#clip0_51_204)">
<g id="Photo strap">
<rect id="Strap backplate" x="140" y="770" width="980" height="180" rx="12" fill="url(#pattern0_51_204)"/>
<rect id="Accent" x="140" y="770" width="10" height="180" fill="#F6A623"/>
<text id="Guest name" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="48" font-weight="bold" letter-spacing="0em"><tspan x="200" y="852.545">Tuomas Lehtinen</tspan></text>
<text id="Guest role" fill="#B7BCC4" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="26" font-weight="500" letter-spacing="0em"><tspan x="200" y="902.045">Head Coach, HJK Helsinki</tspan></text>
</g>
</g>
<defs>
<pattern id="pattern0_51_204" patternContentUnits="objectBoundingBox" width="1" height="1">
<use xlink:href="#image0_51_204" transform="scale(0.5)"/>
</pattern>
<clipPath id="clip0_51_204">
<rect width="1920" height="1080" fill="white"/>
</clipPath>
<image id="image0_51_204" width="2" height="2" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFklEQVR42mP4tkz5P6+A+H8GEAHiAABEjwfjdH5mNwAAAABJRU5ErkJggg=="/>
</defs>
</svg>
