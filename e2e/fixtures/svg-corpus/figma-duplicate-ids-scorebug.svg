<!-- NoaCG SVG corpus / family "figma".
     Exporter: Figma (desktop, 2024) - Export > SVG, Include "id" attribute ON, Outline text OFF.
     What they drew: a two-team scorebug built the way anyone builds one - draw the home side,
     then duplicate the whole group for the away side and retype the words. Figma keeps the
     layer names on a duplicate, so BOTH sides come out named "Team" / "Score", and Figma writes
     a layer name into id verbatim without uniquifying it. The file therefore carries id="Score"
     twice, id="Team" twice and id="Side" twice - valid enough for a browser to draw, and
     illegal the moment it is inlined into an HTML document, where getElementById answers with
     whichever came first.
     docs/SVG_AUTHORING.md §3 states the answer plainly: "two layers called 'Name' arrive as
     'Name' and 'Name 2', which is legible but says nothing" - four fields, all four bindable,
     with the repeat numbered. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Scorebug">
<rect id="Bug plate" x="660" y="80" width="600" height="76" fill="#0D1017" fill-opacity="0.94"/>
<g id="Side">
<rect id="Score plate" x="1012" y="80" width="88" height="76" fill="#161B24"/>
<text id="Team" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="34" font-weight="bold" letter-spacing="0.04em"><tspan x="700" y="130.591">HIFK</tspan></text>
<text id="Score" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="40" font-weight="bold" text-anchor="middle"><tspan x="1056" y="132.909">3</tspan></text>
</g>
<g id="Side">
<rect id="Score plate" x="1100" y="80" width="88" height="76" fill="#1B2130"/>
<text id="Team" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="34" font-weight="bold" letter-spacing="0.04em" text-anchor="end"><tspan x="1000" y="130.591">TPS</tspan></text>
<text id="Score" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="40" font-weight="bold" text-anchor="middle"><tspan x="1144" y="132.909">2</tspan></text>
</g>
<rect id="Accent" x="660" y="150" width="600" height="6" fill="#F6A623"/>
</g>
</svg>
