<!-- NoaCG SVG corpus / effects. Figma (desktop, 2024) - select frame > Export > SVG with
     "Include id attribute" ON and "Outline text" OFF. The designer drew a lower third that is
     revealed by a soft wipe: the whole banner - plate, accent, and BOTH text lines - lives inside
     a group masked by a gradient-filled rect, so the right edge fades out. Figma writes the mask
     with mask-type:alpha, wraps the page in a root clipPath, and puts every layer id on the
     wrapper <g>. The bound text is INSIDE the masked group, which is the question: does binding
     survive a mask, and does the text still paint? -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Wipe lower third" clip-path="url(#clip0_41_218)">
<g id="Reveal">
<mask id="mask0_41_218" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="140" y="760" width="1040" height="190">
<rect id="Wipe edge" x="140" y="760" width="1040" height="190" fill="url(#paint0_linear_41_218)"/>
</mask>
<g mask="url(#mask0_41_218)">
<g id="Banner">
<rect id="Plate" x="140" y="760" width="1040" height="190" rx="8" fill="#0D1017" fill-opacity="0.92"/>
<rect id="Accent" x="140" y="760" width="10" height="190" fill="#F6A623"/>
<text id="Name" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="56" font-weight="bold" letter-spacing="0em"><tspan x="190" y="838.352">Alexandra Riva</tspan></text>
<text id="Role" fill="#B7BCC4" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="30" font-weight="500" letter-spacing="0em"><tspan x="190" y="891.795">Chief Correspondent</tspan></text>
</g>
</g>
</g>
</g>
<defs>
<linearGradient id="paint0_linear_41_218" x1="140" y1="855" x2="1180" y2="855" gradientUnits="userSpaceOnUse">
<stop offset="0.86" stop-color="white"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</linearGradient>
<clipPath id="clip0_41_218">
<rect width="1920" height="1080" fill="white"/>
</clipPath>
</defs>
</svg>
