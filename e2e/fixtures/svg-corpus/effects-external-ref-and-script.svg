<!-- NoaCG SVG corpus / effects. Sketch 100 export, then HAND-EDITED by the designer: they swapped
     the embedded sponsor badge for a CDN link so "it always shows the current sponsor", and pasted
     in a loader snippet they found in a tutorial to fade the badge up. Both hand edits are exactly
     what an exported graphic must not carry to a playout machine with no internet. The card itself
     - full-frame backplate, rule, kicker and sponsor name as live Sketch text - is a perfectly
     ordinary end-of-programme card, and must still import cleanly once the two are removed. -->
<svg width="1920px" height="1080px" viewBox="0 0 1920 1080" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Sponsor card</title>
    <desc>Created with Sketch.</desc>
    <g id="Sponsor-card" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="Backplate" fill="#0D1017" x="0" y="0" width="1920" height="1080"></rect>
        <rect id="Rule" fill="#F6A623" x="240" y="470" width="120" height="6"></rect>
        <text id="Kicker" font-family="Inter-Medium, Inter" font-size="26" font-weight="400" letter-spacing="4" fill="#7F8792">
            <tspan x="240" y="430">IN PARTNERSHIP WITH</tspan>
        </text>
        <text id="Sponsor" font-family="Archivo-Bold, Archivo" font-size="96" font-weight="bold" fill="#FFFFFF">
            <tspan x="240" y="600">Nordvind Energi</tspan>
        </text>
        <image id="Badge" x="1420" y="380" width="260" height="260" opacity="0" xlink:href="https://example.com/badge.png"></image>
    </g>
    <script type="text/javascript"><![CDATA[
        // pasted in from a tutorial - fades the badge up once the page is there
        (function () {
            var badge = document.getElementById('Badge');
            window.addEventListener('load', function () {
                badge.setAttribute('opacity', '1');
            });
        })();
    ]]></script>
</svg>
