<?xml version="1.0" encoding="utf-8"?>
<!-- NoaCG SVG corpus / family "logo".
     Exporter: Adobe Illustrator 28.6 (2024) - File > Export > Export As > SVG, Styling: Presentation Attributes, Images: Embed.
     What they drew: a scorebug down the left edge with a tall club crest (140x220), dark backplate, club name, and score.
     Illustrator writes a placed raster as a positioned <image> element with x/y/width/height, overflow="visible", and inline xlink:href data: URI directly on it.
     The crest picture is a 2x2 PNG so the fixture stays small - the box it sits in is what the
     import reads, and a real crest would only make the file bigger. -->

<!-- Generator: Adobe Illustrator 28.6.0, SVG Export Plug-In . SVG Version: 6.00 Build 0)  -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 1920 1080" width="1920" height="1080" fill="none" style="enable-background:new 0 0 1920 1080;"
	 xml:space="preserve">
<g id="Scorebug">
	<rect id="Bug_x20_backplate" x="140" y="120" width="420" height="260" fill="#0D1017" fill-opacity="0.92"/>
	<image id="Crest" x="170" y="150" width="140" height="220" overflow="visible" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFklEQVR42mP4tkz5P6+A+H8GEAHiAABEjwfjdH5mNwAAAABJRU5ErkJggg=="/>
	<text id="Club" fill="#FFFFFF" font-family="'Archivo-Bold'" font-size="34" font-weight="bold"><tspan x="340" y="250">HJK Helsinki</tspan></text>
	<text id="Score" fill="#F6A623" font-family="'Archivo-Bold'" font-size="64" font-weight="bold"><tspan x="340" y="330">2</tspan></text>
</g>
</svg>
