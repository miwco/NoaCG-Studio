<?xml version="1.0" encoding="utf-8"?>
<!-- NoaCG SVG corpus / family "effects".
     Exporter: Adobe Illustrator 2024 (28.6) - Export As > SVG, Styling: Internal CSS,
     then hand-edited.
     What they drew: an event title card for a university sports night. The type came out wrong
     when they opened the exported file in a browser, so - following the first search result -
     they pasted a Google Fonts @import at the top of the <style> block and a url() texture into
     the panel's fill rule. Both are http(s) references living inside CSS rather than on an
     attribute, which is the one place the file can still reach the internet after every href
     in it is clean.
     docs/SVG_AUTHORING.md §8: any http(s) reference is removed and the removal is reported. The
     face itself (Bebas Neue) is bundled, so nothing here should warn about a font. -->
<!-- Generator: Adobe Illustrator 28.6.0, SVG Export Plug-In . SVG Version: 6.00 Build 0)  -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 1920 1080" style="enable-background:new 0 0 1920 1080;" xml:space="preserve">
<style type="text/css">
	@import url(https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;display=swap);
	.st0{fill:#0D1017;background-image:url("https://cdn.example.com/noise.png");}
	.st1{fill:#F6A623;}
	.st2{fill:#FFFFFF;}
	.st3{font-family:'Bebas Neue';}
	.st4{font-size:110px;}
	.st5{letter-spacing:6;}
	.st6{fill:#B7BCC4;}
	.st7{font-family:'Inter-Medium';}
	.st8{font-size:34px;}
</style>
<g id="Card">
	<rect class="st0" width="1920" height="1080"/>
	<rect x="240" y="596" class="st1" width="180" height="8"/>
	<text id="Event" transform="matrix(1 0 0 1 240 560)" class="st2 st3 st4 st5">CAMPUS CUP FINAL</text>
	<text id="Venue" transform="matrix(1 0 0 1 240 672)" class="st6 st7 st8">Otaniemi Sports Hall, 19:00</text>
</g>
</svg>
