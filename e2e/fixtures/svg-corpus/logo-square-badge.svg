<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- NoaCG SVG corpus / family "logo".
     Exporter: Inkscape 1.3 (0e150ed6c4, 2023-07-21), File > Save As... > Plain SVG.
     What they drew: a lower third with a square organization badge (160x160) at the left end of a charcoal panel, with name and role text layers.
     Inkscape writes a placed raster as a positioned <image> element with x, y, width, height and an inline base64 xlink:href payload.
     The badge picture is a 2x2 PNG so the fixture stays small - the box it sits in is what the
     import reads, and a real badge would only make the file bigger. -->

<!-- Created with Inkscape (http://www.inkscape.org/) -->

<svg
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.0.dtd"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="1920"
   height="1080"
   viewBox="0 0 1920 1080"
   fill="none"
   version="1.1"
   id="svg1"
   inkscape:version="1.3 (0e150ed6c4, 2023-07-21)"
   sodipodi:docname="logo-square-badge.svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:document-units="px"
     showgrid="false"
     inkscape:zoom="0.5"
     inkscape:cx="960"
     inkscape:cy="540"
     inkscape:window-width="1920"
     inkscape:window-height="1009"
     inkscape:window-maximized="1"
     inkscape:current-layer="layer1" />
  <defs
     id="defs1" />
  <g
     inkscape:label="Lower third"
     inkscape:groupmode="layer"
     id="layer1">
    <rect
       style="fill:#0D1017;fill-opacity:1;stroke:none"
       id="rect-panel"
       inkscape:label="Panel bg"
       width="880"
       height="180"
       x="190"
       y="760" />
    <image
       id="image-badge"
       inkscape:label="Badge"
       x="214"
       y="770"
       width="160"
       height="160"
       xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFklEQVR42mP4tkz5P6+A+H8GEAHiAABEjwfjdH5mNwAAAABJRU5ErkJggg==" />
    <text
       xml:space="preserve"
       style="font-style:normal;font-weight:bold;font-size:52px;line-height:1.25;font-family:Archivo;-inkscape-font-specification:'Archivo Bold';letter-spacing:0px;fill:#ffffff;fill-opacity:1;stroke:none"
       x="410"
       y="838"
       id="text-name"
       inkscape:label="Name"><tspan
         sodipodi:role="line"
         id="tspan-name"
         x="410"
         y="838">Aino Virtanen</tspan></text>
    <text
       xml:space="preserve"
       style="font-style:normal;font-weight:500;font-size:28px;line-height:1.25;font-family:Inter;-inkscape-font-specification:'Inter Medium';letter-spacing:0px;fill:#B7BCC4;fill-opacity:1;stroke:none"
       x="410"
       y="898"
       id="text-role"
       inkscape:label="Role"><tspan
         sodipodi:role="line"
         id="tspan-role"
         x="410"
         y="898">Meteorologist</tspan></text>
  </g>
</svg>
