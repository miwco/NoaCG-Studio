<!-- NoaCG SVG corpus / family "inkscape".
     Exporter: Inkscape 1.3 (0e150ed6c4, 2023-07-21), File > Save As... > Inkscape SVG.
     What they drew: a full-frame competition bumper. The headline CHAMPIONS was set with the
     text tool, an arc was drawn with the bezier tool, both were selected and Text > Put on Path
     was used - so the run now lives in <textPath xlink:href="#curve"> and the arc itself was
     dragged into <defs> afterwards so it would stop showing in the layer list. The <text> keeps
     the x/y it had BEFORE it went on the path; those numbers no longer say where it paints.
     The strap under it is ordinary text in DejaVu Sans, the font that happened to be on the
     volunteer's Linux box. -->
