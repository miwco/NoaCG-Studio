<?xml version="1.0" encoding="UTF-8"?>
<!-- CorelDRAW Graphics Suite 2021 - File > Export > SVG, "Responsive" unchecked, styling
     "Internal CSS", text left as text. The designer drew a plain LOWER THIRD (name, role,
     location) on a 1920x1080 page. Corel writes the page size as unit-suffixed lengths and
     emits NO viewBox at all, so the only statement of the design space is width="1920px"
     height="1080px" - and because Corel's default text unit is points, the type sizes in the
     stylesheet are in pt while the geometry is in px. Both units are in one file on purpose.
     Corel tells: the shape-rendering/text-rendering/image-rendering/fill-rule/clip-rule style
     preamble on the root, xml:space="preserve", a CDATA-wrapped internal stylesheet of .filN
     fill classes and .fntN font classes, the layer wrapper id="Layer_x0020_1" with its
     <metadata id="CorelCorpID_0Corel-Layer"/> sibling, doubled spaces before the coordinate
     attributes on <text>, and single-space indentation. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" width="1920px" height="1080px" version="1.1"
 style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd">
 <defs>
  <style type="text/css">
   <![CDATA[
    .fil0 {fill:#0D1017}
    .fil1 {fill:#F6A623}
    .fil2 {fill:#FEFEFE}
    .fil3 {fill:#B7BCC4}
    .fil4 {fill:#7F8792}
    .fnt0 {font-weight:bold;font-size:42pt;font-family:'Archivo'}
    .fnt1 {font-weight:normal;font-size:22pt;font-family:'Inter'}
    .fnt2 {font-weight:normal;font-size:16pt;font-family:'Inter';letter-spacing:2px}
   ]]>
  </style>
 </defs>
 <g id="Layer_x0020_1">
  <metadata id="CorelCorpID_0Corel-Layer"/>
  <rect id="Panel" class="fil0" x="140" y="760" width="1040" height="190"/>
  <rect id="Accent" class="fil1" x="140" y="760" width="10" height="190"/>
  <text id="Name" class="fil2 fnt0"  x="190" y="842">Alexandra Riva</text>
  <text id="Role" class="fil3 fnt1"  x="190" y="894">Chief Correspondent</text>
  <text id="Location" class="fil4 fnt2"  x="190" y="934">HELSINKI</text>
 </g>
</svg>
