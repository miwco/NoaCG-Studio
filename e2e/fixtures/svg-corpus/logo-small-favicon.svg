<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- NoaCG SVG corpus / family "logo".
     Exporter: Affinity Designer 2 (macOS) - Export > SVG (for export) preset, rasterise nothing,
     embed images.
     What they drew: a single corner mark - a 32x32 favicon-sized logo image and a handle label -
     placed in the top-right of a 1920x1080 frame. The mark is so small relative to the canvas that
     an operator importing it for the first time will wonder whether anything arrived at all. That
     tiny scale is the point: the slot stretches whatever it is given, and this tests whether it
     does so at a size where the pixel budget is essentially nothing.
     The picture is a 2x2 PNG - a corpus stand-in, not a real logo asset.
     Affinity habits reproduced: <?xml?> prolog with standalone="no", xmlns:serif declaration,
     serif:id attributes carrying the human layer names alongside the sanitised id attributes,
     style="" block on the root, tab indentation, px units on text x/y, font specified as a
     PostScript-style quoted pair ('Inter-Medium', 'Inter'), and fill/opacity as inline style
     properties rather than presentation attributes on rect/image. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <g id="Corner-mark" serif:id="Corner mark">
        <image id="Favicon" x="1840" y="40" width="32" height="32" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFklEQVR42mP4tkz5P6+A+H8GEAHiAABEjwfjdH5mNwAAAABJRU5ErkJggg==" xmlns:xlink="http://www.w3.org/1999/xlink"/>
        <text id="Handle" x="1700px" y="100px" style="font-family:'Inter-Medium', 'Inter';font-weight:500;font-size:20px;fill:#B7BCC4;"><tspan x="1700" y="100">@yleurheilu</tspan></text>
    </g>
</svg>
