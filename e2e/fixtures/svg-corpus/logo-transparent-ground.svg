<!-- Figma (desktop, 2024 export engine) - Export > SVG, ids ON, text live. The frame itself was
     left with no fill so the lockup sits over live video.
     The designer drew a sponsor lockup where the logo image sits ON a dark coloured backplate and
     the logo's own transparent pixels let the plate colour show through the holes. The logo
     artwork is placed inside a rect filled with a Figma <pattern>, not a positioned <image> - that
     is how Figma always embeds a raster into a shape. The picture is a 2x2 RGBA PNG where two of
     the four pixels are fully transparent - the corpus stand-in for a logo with holes in it.
     Figma habits reproduced: no <?xml?> prolog, zero indentation, fill="none" on the root,
     outer <g clip-path="url(#...)"> wrapping the art, <clipPath> and <pattern> in <defs>, the
     <pattern> holding a <use xlink:href="#imageN"> with a scale() transform mapping pixel size into
     objectBoundingBox units (2px source -> scale(0.5)), and the <image> carrying the base64 data
     parked last in <defs>. Uppercase hex colours. xml:space="preserve" plus
     style="white-space: pre" on text elements. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<g clip-path="url(#clip0_72_301)">
<g id="Sponsor lockup">
<rect id="Lockup plate" x="760" y="940" width="480" height="90" rx="6" fill="#0D1017" fill-opacity="0.92"/>
<rect id="Sponsor mark" x="790" y="960" width="200" height="50" fill="url(#pattern0_72_301)"/>
<text id="Presented by" fill="#6E7480" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="18" font-weight="500" letter-spacing="0.08em"><tspan x="1010" y="992">PRESENTED BY</tspan></text>
</g>
</g>
<defs>
<pattern id="pattern0_72_301" patternContentUnits="objectBoundingBox" width="1" height="1">
<use xlink:href="#image0_72_301" transform="scale(0.5)"/>
</pattern>
<clipPath id="clip0_72_301">
<rect width="1920" height="1080" fill="white"/>
</clipPath>
<image id="image0_72_301" width="2" height="2" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAEUlEQVR42mP4tkz5PwMMgDgAMdYFfV+lqXsAAAAASUVORK5CYII="/>
</defs>
</svg>
