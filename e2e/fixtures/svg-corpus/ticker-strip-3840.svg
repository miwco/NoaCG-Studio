<!-- Figma (Aug 2026 web app) - frame "News Ticker" selected, Export > SVG with "Include id
     attribute" ON and "Outline text" OFF. The designer drew a full-width NEWS TICKER: an amber
     category flag, a scrolling headline line and a clock, on a 3840x120 frame so the strip can
     run at double width across a 4K bar without resampling. The artboard is deliberately not
     frame-shaped - it is a strip, 32:1.
     Figma tells: no XML declaration, fill="none" on the root, the whole frame wrapped in a
     clip-path group with a clip0_<node>_<id> name, layer names verbatim in id (spaces kept),
     uppercase hex fills and the literal fill="white", every <text> carrying
     xml:space="preserve" style="white-space: pre" with the typography as attributes and the
     content inside a single positioned <tspan> with a fractional baseline, and no indentation. -->
<svg width="3840" height="120" viewBox="0 0 3840 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="News Ticker" clip-path="url(#clip0_18_204)">
<rect id="Bar" width="3840" height="120" fill="#0D1017"/>
<rect id="Flag" width="360" height="120" fill="#F6A623"/>
<text id="Category" fill="#10131A" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="40" font-weight="bold" letter-spacing="0.06em"><tspan x="48" y="76.32">BREAKING</tspan></text>
<rect id="Divider" x="3520" width="2" height="120" fill="#2A303C"/>
<text id="Headline" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="46" font-weight="500" letter-spacing="0em"><tspan x="424" y="76.98">Parliament passes the budget after a nine-hour sitting</tspan></text>
<text id="Clock" fill="#B7BCC4" xml:space="preserve" style="white-space: pre" font-family="JetBrains Mono" font-size="34" font-weight="500" letter-spacing="0.02em"><tspan x="3576" y="74.66">22:40</tspan></text>
<rect id="Rule" y="116" width="3840" height="4" fill="#F6A623"/>
</g>
<defs>
<clipPath id="clip0_18_204">
<rect width="3840" height="120" fill="white"/>
</clipPath>
</defs>
</svg>
