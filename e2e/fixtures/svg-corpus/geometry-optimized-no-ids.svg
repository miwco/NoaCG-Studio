<!-- NoaCG SVG corpus / family "geometry".
     Exporter: Figma - Export > SVG, then run through SVGO 3 (SVGOMG, default preset).
     What they drew: an ordinary three-line lower third. Then the file went through the optimizer
     everybody's "how to use SVG" article recommends, and the optimizer did exactly its job: the
     XML declaration, every comment, every <g> wrapper and EVERY id are gone (cleanupIds drops an
     id nothing references), the stylesheet is inlined onto the elements, numbers are rounded to
     three decimals, and the whole document is one line.
     Nothing about the ARTWORK changed - it draws pixel for pixel what Figma exported. What is
     gone is every name a label could be read from, which docs/SVG_AUTHORING.md §3 warns about
     from the other direction ("name your layers"). This file is what the warning looks like
     when it is already too late: the fields must still be there, honestly numbered.
     (The corpus header comment above is ours; SVGO removed the file's own.) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" fill="none" viewBox="0 0 1920 1080"><rect width="880" height="180" x="190" y="760" fill="#0D1017" fill-opacity=".92"/><rect width="10" height="180" x="190" y="760" fill="#F6A623"/><rect width="600" height="2" x="240" y="862" fill="#2A2F3A"/><text xml:space="preserve" fill="#fff" font-family="Archivo" font-size="52" font-weight="700" letter-spacing="0em" style="white-space:pre"><tspan x="240" y="838.727">Aino Virtanen</tspan></text><text xml:space="preserve" fill="#B7BCC4" font-family="Inter" font-size="28" font-weight="500" letter-spacing=".02em" style="white-space:pre"><tspan x="240" y="898.318">Meteorologist</tspan></text><text xml:space="preserve" fill="#6E7480" font-family="Inter" font-size="22" font-weight="500" letter-spacing=".08em" style="white-space:pre"><tspan x="240" y="932.5">HELSINKI</tspan></text></svg>
