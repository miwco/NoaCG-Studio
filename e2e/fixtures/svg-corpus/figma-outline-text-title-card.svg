<!-- Figma (desktop, 2024 export engine) - Export > SVG with "Outline text" ON, which is the
     checkbox a designer leaves ticked because it makes the file look identical everywhere.
     The designer drew a full-frame 1080p opening card: a dark backplate, an amber rule, a
     show title and an episode line. Both text layers came out as vector, and Figma flattens
     a whole text layer into ONE compound <path> - every glyph is a subpath of the same "d",
     not its own element - so there is no <text> anywhere in this file. -->
