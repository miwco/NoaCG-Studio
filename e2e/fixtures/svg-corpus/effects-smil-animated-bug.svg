<!-- NoaCG SVG corpus / family "effects".
     Exporter: Figma - Export > SVG, then hand-edited in VS Code.
     What they drew: a corner bug for a student radio stream. Figma wrote the shapes and the two
     text layers; the student then followed a "animate SVG without JavaScript" tutorial and added
     SMIL by hand - a pulsing dot (<animate> on r and on opacity), a slow drift on the whole bug
     (<animateTransform>), and a <set> that flips the strap's fill after four seconds. Every one
     of those is wall-clock motion the playout server cannot drive.
     docs/SVG_AUTHORING.md rule 5 and §8: SMIL is removed WITH A NOTE, and motion is added in the
     Animation step instead. The two text layers must survive the removal. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Live bug">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" repeatCount="indefinite"/>
<rect id="Bug plate" x="1560" y="80" width="280" height="72" rx="8" fill="#0D1017" fill-opacity="0.92"/>
<circle id="On air dot" cx="1600" cy="116" r="10" fill="#F6A623">
<animate attributeName="r" values="10;13;10" dur="1.6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
</circle>
<g id="Station">
<text fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="26" font-weight="bold" letter-spacing="0.08em"><tspan x="1626" y="125.273">RADIO NOA</tspan></text>
</g>
<g id="Strap">
<rect id="Strap plate" x="1560" y="152" width="280" height="34" fill="#161B24">
<set attributeName="fill" to="#F6A623" begin="4s"/>
</rect>
<text fill="#B7BCC4" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="18" font-weight="500"><tspan x="1576" y="175.045">Morning show</tspan></text>
</g>
</g>
</svg>
