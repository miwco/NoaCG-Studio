<!-- NoaCG SVG corpus / family "logo".
     Figma (desktop, 2024 export engine) - Export > SVG, ids ON, text live. The frame itself was
     left with no fill so the bug sits over live video.
     The designer drew a channel bug in the top-right corner with a wide wordmark logo filling
     a rounded plate, an amber edge bar, and a strand text line below it.
     Figma NEVER writes a placed image as a positioned <image> - it fills the shape with a
     <pattern>, and the pattern <use>s an <image> parked at the bottom of <defs> carrying the
     base64 payload. The scale() maps the pixel size into the pattern's objectBoundingBox units
     (2px source -> scale(0.5)). The picture is a 2x2 PNG so the fixture stays small. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<g clip-path="url(#clip0_88_504)">
<g id="Channel bug">
<rect id="Logo plate" x="1300" y="60" width="520" height="120" rx="8" fill="url(#pattern0_88_504)"/>
<rect id="Plate edge" x="1300" y="60" width="6" height="120" fill="#F6A623"/>
<text id="Strand" fill="#B7BCC4" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="24" font-weight="500" letter-spacing="0.08em"><tspan x="1330" y="228">WEEKNIGHTS AT NINE</tspan></text>
</g>
</g>
<defs>
<pattern id="pattern0_88_504" patternContentUnits="objectBoundingBox" width="1" height="1">
<use xlink:href="#image0_88_504" transform="scale(0.5)"/>
</pattern>
<clipPath id="clip0_88_504">
<rect width="1920" height="1080" fill="white"/>
</clipPath>
<image id="image0_88_504" width="2" height="2" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFklEQVR42mP4tkz5P6+A+H8GEAHiAABEjwfjdH5mNwAAAABJRU5ErkJggg=="/>
</defs>
</svg>
