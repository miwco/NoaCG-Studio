<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- NoaCG SVG corpus / family "affinity".
     Exporter: Affinity Designer 2.4 (macOS) - File > Export > SVG (for print).
     What they drew: a name plate for a faculty lecture series. Affinity is a print tool and the
     document was started from a print preset, so its unit is POINTS: the file says
     width="960pt" height="540pt" with viewBox="0 0 960 540". At the 96dpi the SVG spec fixes,
     960pt is exactly 1280 CSS pixels and 540pt is exactly 720 - a 720p page. Nothing in the file
     says 1280 or 720.
     This is the millimetre case (inkscape-millimetre-scorebug) in a SECOND unit, on purpose: a
     conversion that knows only about mm would read this one at 960 x 540 and place a full page as
     a two-thirds-size object. docs/SVG_AUTHORING.md §2: "the artwork's own size drives the
     graphic". -->
<svg width="960pt" height="540pt" viewBox="0 0 960 540" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <g id="Name-plate" serif:id="Name plate">
        <rect x="95" y="380" width="440" height="90" style="fill:rgb(13,16,23);fill-opacity:0.94;"/>
        <rect x="95" y="380" width="5" height="90" style="fill:rgb(246,166,35);"/>
        <text id="Speaker" x="120px" y="418px" style="font-family:'Archivo-Bold', 'Archivo';font-weight:700;font-size:28px;fill:white;">Dr Aino Virtanen</text>
        <text id="Faculty" x="120px" y="448px" style="font-family:'Inter-Medium', 'Inter';font-weight:500;font-size:15px;fill:rgb(183,188,196);">Faculty of Science</text>
    </g>
</svg>
