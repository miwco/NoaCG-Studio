<!-- Figma (desktop, 2024 export engine) - selected the frame "Lower Third" in the layers panel,
     Export > SVG, "Include 'id' attribute" ON, "Outline text" OFF, "Simplify stroke" default.
     The designer drew a 1920x1080 frame: a rounded charcoal panel, a 10px amber rule down its
     left edge, and three text layers named Name / Role / Location.
     Straight out of Figma, untouched: no XML prolog, no indentation at all, fill="none" on the
     root, and everything wrapped in the frame's clip group keyed to its node id. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_12_84)">
<g id="Lower Third">
<g id="Panel">
<rect id="Panel bg" x="140" y="760" width="1040" height="190" rx="8" fill="#0D1017" fill-opacity="0.92"/>
<rect id="Accent" x="140" y="760" width="10" height="190" fill="#F6A623"/>
</g>
<text id="Name" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="56" font-weight="bold" letter-spacing="0em"><tspan x="190" y="838.727">Alexandra Riva</tspan></text>
<text id="Role" fill="#B7BCC4" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="30" font-weight="500" letter-spacing="0em"><tspan x="190" y="891.591">Chief Correspondent</tspan></text>
<text id="Location" fill="#7F8792" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="22" font-weight="500" letter-spacing="0.18em"><tspan x="190" y="931.25">HELSINKI</tspan></text>
</g>
</g>
<defs>
<clipPath id="clip0_12_84">
<rect width="1920" height="1080" fill="white"/>
</clipPath>
</defs>
</svg>
