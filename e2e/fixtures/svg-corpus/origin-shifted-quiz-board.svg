<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Affinity Designer 2.4 (Serif) - Export persona > SVG (digital, small file), document
     coordinates kept. The designer drew a centred four-answer QUIZ BOARD on a 1920x1080
     document whose origin sits in the middle of the page, so every coordinate in the file is
     signed and the viewBox min-x / min-y are negative. Nothing here is wrong or unusual - this
     is simply what a Serif export looks like when the artboard is centred on the origin.
     Affinity tells: xmlns:serif + serif:id carrying the original layer name, the
     fill-rule/clip-rule/stroke-linejoin style preamble on the root, rgb() colours in inline
     style strings, px-suffixed x/y on <text>, PostScript-name-first font stacks, and
     matrix(1,0,0,1,tx,ty) translations on repeated rows drawn once and moved. 4-space indent. -->
<svg width="1920" height="1080" viewBox="-960 -540 1920 1080" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:serif="http://www.serif.com/" xml:space="preserve"
     style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <g id="Board" serif:id="Board">
        <rect x="-820" y="-460" width="1640" height="920" style="fill:rgb(13,16,23);fill-opacity:0.94;"/>
        <rect x="-820" y="-460" width="1640" height="10" style="fill:rgb(246,166,35);"/>
    </g>
    <g id="Question" serif:id="Question">
        <text x="-760px" y="-280px" style="font-family:'Archivo-Bold', 'Archivo';font-weight:700;font-size:60px;fill:white;">Which river runs through Rovaniemi?</text>
    </g>
    <g id="Answers" serif:id="Answers">
        <g id="Answer-A" serif:id="Answer A" transform="matrix(1,0,0,1,0,0)">
            <rect x="-760" y="-160" width="1520" height="120" style="fill:rgb(22,27,36);"/>
            <rect x="-760" y="-160" width="8" height="120" style="fill:rgb(246,166,35);"/>
            <text x="-696px" y="-82px" style="font-family:'Inter-Medium', 'Inter';font-weight:500;font-size:42px;fill:white;">Kemijoki</text>
        </g>
        <g id="Answer-B" serif:id="Answer B" transform="matrix(1,0,0,1,0,150)">
            <rect x="-760" y="-160" width="1520" height="120" style="fill:rgb(22,27,36);"/>
            <rect x="-760" y="-160" width="8" height="120" style="fill:rgb(246,166,35);"/>
            <text x="-696px" y="-82px" style="font-family:'Inter-Medium', 'Inter';font-weight:500;font-size:42px;fill:white;">Ounasjoki</text>
        </g>
        <g id="Answer-C" serif:id="Answer C" transform="matrix(1,0,0,1,0,300)">
            <rect x="-760" y="-160" width="1520" height="120" style="fill:rgb(22,27,36);"/>
            <rect x="-760" y="-160" width="8" height="120" style="fill:rgb(246,166,35);"/>
            <text x="-696px" y="-82px" style="font-family:'Inter-Medium', 'Inter';font-weight:500;font-size:42px;fill:white;">Tornionjoki</text>
        </g>
        <g id="Answer-D" serif:id="Answer D" transform="matrix(1,0,0,1,0,450)">
            <rect x="-760" y="-160" width="1520" height="120" style="fill:rgb(22,27,36);"/>
            <rect x="-760" y="-160" width="8" height="120" style="fill:rgb(246,166,35);"/>
            <text x="-696px" y="-82px" style="font-family:'Inter-Medium', 'Inter';font-weight:500;font-size:42px;fill:white;">Iijoki</text>
        </g>
    </g>
</svg>
