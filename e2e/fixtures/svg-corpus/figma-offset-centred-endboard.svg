<!-- NoaCG SVG corpus / family "figma".
     Exporter: Figma (desktop, 2024) - Export > SVG, Include "id" attribute ON, Outline text OFF.
     What they drew: the endboard of a student show. The plate runs almost the full width of the
     frame, but the two lines are composed over its LEFT side on purpose - the right third is
     empty negative space the channel's bug sits in on air, so nothing is drawn there. Both text
     layers are centre-aligned in Figma, so both export as text-anchor="middle" with the tspan's
     x at the centre of the LINE - and that centre is 260 units left of the plate's own.
     docs/SVG_AUTHORING.md §3: the file says where the text is anchored and where it was drawn,
     and those are two different facts here. A longer value grows both ways from where it was
     drawn; it does not slide onto the plate's midline, and it does not paint off the plate. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_84_112)">
<rect width="1920" height="1080" fill="#0D1017"/>
<g id="Endboard">
<rect id="Plate" x="200" y="380" width="1520" height="320" fill="#12161F"/>
<text id="Sign off" fill="white" xml:space="preserve" style="white-space: pre" font-family="Archivo" font-size="72" font-weight="bold" letter-spacing="-0.01em" text-anchor="middle"><tspan x="700" y="525.6">Kiitos katsomisesta</tspan></text>
<text id="Next time" fill="#B7BCC4" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="28" font-weight="500" text-anchor="middle"><tspan x="700" y="608.8">Nähdään ensi viikolla</tspan></text>
</g>
</g>
<defs>
<clipPath id="clip0_84_112">
<rect width="1920" height="1080" fill="white"/>
</clipPath>
</defs>
</svg>
