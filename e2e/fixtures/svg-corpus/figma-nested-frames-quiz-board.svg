<!-- Figma (desktop, 2024 export engine) - Export > SVG, "Include 'id' attribute" ON, text live.
     The designer built the board with auto-layout: a page frame holding a header frame and an
     answers frame, each with its own padding wrapper, and only the rows themselves ever got
     renamed. Figma's default names ride out verbatim - "Frame 1000004321", "Rectangle 118" -
     and the meaningful names (Question, Answer A..D) sit four and five levels down.
     Note the text layers: a Figma text layer is named after its own content until somebody
     renames it, so id="Amsterdam" is a default name, not a label the designer chose. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_58_1102)">
<g id="Quiz Board">
<rect id="Backplate" width="1920" height="1080" fill="#0B0E14" fill-opacity="0.94"/>
<g id="Frame 1000004321">
<g id="Frame 427320567">
<g id="Frame 1707478242">
<g id="Question">
<rect id="Rectangle 118" x="260" y="180" width="1400" height="190" rx="12" fill="#11151D"/>
<text id="Which city hosted the 1952 Summer Olympics?" fill="white" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="52" font-weight="600" letter-spacing="0em"><tspan x="310" y="293.591">Which city hosted the 1952 Summer Olympics?</tspan></text>
</g>
</g>
</g>
<g id="Frame 1000004322">
<g id="Answer A">
<rect id="Rectangle 119" x="260" y="430" width="1400" height="120" rx="12" fill="#161B24"/>
<text id="Amsterdam" fill="#E6E9EE" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="38" font-weight="500" letter-spacing="0em"><tspan x="330" y="503.182">Amsterdam</tspan></text>
</g>
<g id="Answer B">
<rect id="Rectangle 120" x="260" y="570" width="1400" height="120" rx="12" fill="#161B24"/>
<text id="Helsinki" fill="#E6E9EE" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="38" font-weight="500" letter-spacing="0em"><tspan x="330" y="643.182">Helsinki</tspan></text>
</g>
<g id="Answer C">
<rect id="Rectangle 121" x="260" y="710" width="1400" height="120" rx="12" fill="#161B24"/>
<text id="Melbourne" fill="#E6E9EE" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="38" font-weight="500" letter-spacing="0em"><tspan x="330" y="783.182">Melbourne</tspan></text>
</g>
<g id="Answer D">
<g id="Frame 21">
<rect id="Rectangle 122" x="260" y="850" width="1400" height="120" rx="12" fill="#161B24"/>
<text id="Reykjavik" fill="#E6E9EE" xml:space="preserve" style="white-space: pre" font-family="Inter" font-size="38" font-weight="500" letter-spacing="0em"><tspan x="330" y="923.182">Reykjavik</tspan></text>
</g>
</g>
</g>
</g>
</g>
</g>
<defs>
<clipPath id="clip0_58_1102">
<rect width="1920" height="1080" fill="white"/>
</clipPath>
</defs>
</svg>
