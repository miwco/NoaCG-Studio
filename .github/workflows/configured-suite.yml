# THE CONFIGURED (AUTHENTICATED) SUITE — against a LOCAL Supabase stack on the runner.
#
# `e2e/configured/` needs a real Supabase backend and a signed-in account, so it is the only suite
# in the repo that no automation touched. ci.yml plans from scripts/e2e-affected.mjs, and that
# script IGNORES `e2e/configured/**` on purpose; nightly.yml runs the OFFLINE config against a
# different testDir. So these 32 specs — account, community, moderation, feedback, analytics, the
# Pro wizard, agent access, and the four hosted-playout walks the student release is judged on —
# were verified only when somebody remembered to type `npm run test:e2e:live` on a laptop that
# happened to have an .env.
#
# WHY A LOCAL STACK RATHER THAN A HOSTED PROJECT. The obvious route is a staging Supabase project,
# and it was costed: an extra project on the org's Pro plan is $10/month, a new Free org is $0.
# This route is $0 too and buys two things neither hosted option can:
#   - NO SUPABASE SECRET EVER LIVES IN GITHUB. The local stack's keys are the CLI's published
#     shared defaults, read at runtime from `supabase status`. There is nothing here worth
#     stealing, so the question "who can read our service-role key" stops existing rather than
#     being managed. The previous design deliberately withheld SUPABASE_SERVICE_ROLE_KEY because
#     this repository is public and .env points at PRODUCTION — which cost two specs their
#     coverage. Both are back.
#   - NOTHING IS WRITTEN TO PRODUCTION. The suite creates and deletes real rows every run; until
#     now they landed in the owner's production project, against playwright.live.config.ts's own
#     advice ("point .env at a test/staging Supabase project ... never a production tenant").
#
# WHAT THIS ROUTE GIVES UP, stated plainly because it is easy to forget: a local stack answers in
# ~1 ms where a hosted one answers in ~200 ms from a runner. On 2026-08-24 a real user-facing
# sync defect (every tombstone re-fetched in its own sequential round trip) was invisible on a
# laptop at 5 ms/request and failed six specs at 207 ms/request from a runner. THIS JOB WOULD NOT
# HAVE CAUGHT THAT. Latency-shaped regressions need a hosted target or a deliberate delay; do not
# read a green run here as evidence that sync is fast enough anywhere real.
#
# NIGHTLY, not weekly: the suite costs minutes, and the surfaces it covers (quiz-output,
# scorebug-output, imported-quiz-output, output-cold-boot, hosted-control-recovery) are what the
# 2026-09-12 production is judged on. Its own schedule and its own rolling issue rather than
# joining nightly.yml, so an infrastructure fault here can never red the main nightly verdict.
#
# THE FAILURE MODE THIS WORKFLOW IS BUILT AROUND. Every spec calls `test.skip(!haveCreds, …)`, so
# with the environment unset the run executes NOTHING and exits 0 — a job checking only the exit
# code is permanently, silently green, which is the hole that let five specs sit on main
# unverified. The guards, in order: the stack must come up, the schema must match the repository,
# the realtime publication must hold the tables the playout specs subscribe to, the test account
# must actually AUTHENTICATE (not merely exist), and the JSON report must show nothing skipped and
# at least MIN_TESTS run. Every way this job could execute zero tests fails loudly.

name: configured-suite

on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: configured-suite
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # the rolling-issue steps

jobs:
  configured:
    name: Configured E2E (authenticated, local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The local stack's identity. Not secrets: the account lives only inside this runner and is
      # destroyed with it, so the values are literals rather than repository secrets. Six chars is
      # GoTrue's default minimum and account.spec.ts round-trips a password change.
      E2E_EMAIL: e2e@noacg.local
      E2E_PASSWORD: noacg-e2e-local-pw
      # JOB level, not step level, deliberately: `supabase status` and `supabase stop` load
      # config.toml too, and config.toml's [auth.external.google] reads these through env().
      # Measured 2026-08-25: the unmodified config loads cleanly with them UNSET, so this is
      # belt-and-braces for GoTrue rather than a fix for the CLI. Setting
      # SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED=false was tried and does NOT suppress the provider —
      # that boolean override is a no-op on 2.111.0. No spec uses Google sign-in.
      SUPABASE_AUTH_GOOGLE_CLIENT_ID: local-e2e-unused
      SUPABASE_AUTH_GOOGLE_SECRET: local-e2e-unused
      # The suite declares 33 tests across 17 spec files. With the local stack there is no reason
      # for ANY of them to skip - both specs that used to need the service-role key now have it.
      MIN_TESTS: 33
      # Deliberately EMPTY. Every skip is a failure now. An entry here is coverage being given up,
      # so adding one needs a reason written next to it.
      ALLOWED_SKIPS: ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: ./.github/actions/playwright-chromium

      # PINNED, not `latest`. Two opposing risks make the version a real decision: an OLD CLI does
      # not understand config.toml's [auth.hook.before_user_created] and refuses the file outright,
      # while a NEWER one is migrating `supabase status` away from ANON_KEY / SERVICE_ROLE_KEY
      # towards the publishable/secret names this job reads. `latest` also makes the job
      # irreproducible: the same commit can go red on a CLI release nobody here made. 2.111.0 is
      # the version the project is developed against.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      # THE FOUNDATION, AND THE STEP MOST LIKELY TO FAIL FIRST.
      #
      # These 50 migrations were written against HOSTED Supabase and have never been applied to
      # the CLI's local Postgres image (supabase/README.md says so in its own words). Three known
      # hazards, all of which surface here rather than subtly later: `create extension pg_cron`
      # in 0037/0039 needs shared_preload_libraries; 0003 and 0008 both
      # `alter publication supabase_realtime add table` guarded only on whether the TABLE is
      # already published, never on whether the PUBLICATION exists, and NO migration creates it;
      # and config.toml pins `major_version = 15` against whatever the CLI ships.
      #
      # `supabase start` bootstraps a fresh volume by applying supabase/migrations then seed.sql.
      # Only studio and edge-runtime are excluded - the two provably unused (no spec opens Studio,
      # and there is no supabase/functions directory to serve). Realtime and storage MUST stay:
      # src/control/hostedControl.ts subscribes to postgres_changes, and migration 0001 creates
      # the storage buckets. Nothing else is trimmed before the first run is measured.
      - name: Start the local Supabase stack
        run: |
          set -euo pipefail
          supabase start -x studio,edge-runtime
          echo "--- containers actually running ---"
          docker ps --format '{{.Names}}\t{{.Image}}'

      # Read the stack's identity MACHINE-READABLY. `-o env` is a trap: the CLI formats it with
      # godotenv (`%s="%s"`), and $GITHUB_ENV takes everything after `=` literally — so the quotes
      # would become part of the value, the URL would be unparseable, and a non-empty guard would
      # happily pass on a two-character `""`. `-o json` + jq avoids all of it, and exports exactly
      # the four values wanted rather than everything the CLI knows.
      #
      # VITE_* reach the browser bundle (Vite inlines prefixed vars from the environment, verified
      # 2026-08-24); the unprefixed pair is what api/ handlers read from process.env, which is how
      # agent-access gets its server half back. vite.config.ts only fills MISSING keys from .env,
      # so these always win.
      - name: Export the local stack's URL and keys
        run: |
          set -euo pipefail
          status="$(supabase status -o json)"
          api_url="$(printf '%s' "$status" | jq -r '.API_URL // empty')"
          anon="$(printf '%s' "$status" | jq -r '.ANON_KEY // empty')"
          service="$(printf '%s' "$status" | jq -r '.SERVICE_ROLE_KEY // empty')"
          db_url="$(printf '%s' "$status" | jq -r '.DB_URL // empty')"
          for pair in "API_URL=$api_url" "ANON_KEY=$anon" "SERVICE_ROLE_KEY=$service" "DB_URL=$db_url"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "$value" ] || [ "$value" = '""' ]; then
              echo "::error title=Local stack produced no ${name}::\`supabase status -o json\` returned nothing usable for ${name}. The CLI may have renamed its output keys - read the raw output below and update this step rather than loosening the guard."
              printf '%s\n' "$status"
              exit 1
            fi
          done
          # Mask BEFORE writing, never after: masking a value already in the log is the wrong order
          # even when nothing printed it in between.
          echo "::add-mask::$service"
          {
            echo "VITE_SUPABASE_URL=$api_url"
            echo "VITE_SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "SUPABASE_DB_URL=$db_url"
          } >> "$GITHUB_ENV"
          echo "Local stack at ${api_url}."

      # THE SCHEMA MUST BE THE REPOSITORY'S SCHEMA, and the realtime publication must hold the
      # tables the playout specs subscribe to. Both are asserted rather than assumed, because both
      # fail SILENTLY in a way that reads as a product regression: a half-applied schema (0003
      # aborting takes everything after it with it) or a missing publication would surface only as
      # "the output renderer never moved", 30 seconds at a time, in four specs.
      #
      # psql is reached through the database CONTAINER rather than the runner, so the client
      # matches the server and no undeclared ubuntu-latest package is relied on. The container is
      # discovered rather than named: `supabase_db_<project_id>` is a CLI convention this repo
      # does not own.
      # REPRODUCE HOSTED SUPABASE'S DEFAULT PRIVILEGES.
      #
      # This step compensates for a defect in the repository's own migrations, and should be
      # DELETED the day that defect is fixed rather than kept as a convenience.
      #
      # `supabase/migrations` never grants table privileges to `anon` / `authenticated`. On a
      # hosted project it does not have to: Supabase's bootstrap sets default privileges so every
      # table created in `public` picks them up automatically. Verified against production
      # 2026-08-25 — `information_schema.role_table_grants` shows anon and authenticated holding
      # SELECT/INSERT/UPDATE/DELETE on public.documents, granted by no migration in this tree.
      #
      # The local stack does not reproduce that for migration-created tables, so every signed-in
      # request comes back `42501 permission denied for table documents` and the app reports
      # "Sync error". Measured: 17 of 32 specs failed this way on run 32792548123.
      #
      # That means `supabase start` — the command supabase/README.md gives self-hosters as the way
      # to stand up an instance — currently produces a database the app cannot read. This is a
      # REAL defect for self-hosters, not a CI quirk, and the honest fix is a migration that grants
      # explicitly so the schema stops depending on the host's bootstrap. Until that lands, this
      # step keeps CI honest about everything ELSE while being loud about what it is doing.
      #
      # RLS still governs every row: grants decide whether the role may touch the table at all,
      # policies decide which rows. Reproducing the hosted grant matrix cannot widen access beyond
      # what production already allows.
      - name: Grant the privileges hosted Supabase grants by default
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db' --format '{{.Names}}' | head -1)"
          if [ -z "$db_container" ]; then
            echo "::error title=No database container::Could not find the local Postgres container."
            docker ps --format '{{.Names}}'
            exit 1
          fi
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          grant usage on schema public to anon, authenticated, service_role;
          grant all on all tables in schema public to anon, authenticated, service_role;
          grant all on all sequences in schema public to anon, authenticated, service_role;
          grant all on all functions in schema public to anon, authenticated, service_role;
          alter default privileges in schema public grant all on tables to anon, authenticated, service_role;
          SQL
          echo "::warning title=Compensating for missing grants::supabase/migrations does not grant table privileges to anon/authenticated; this job reproduces hosted Supabase's defaults so the suite can run. A self-hoster following supabase/README.md gets a database the app cannot read. Fix in a migration and delete this step."

      - name: Assert the schema and the realtime publication
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db' --format '{{.Names}}' | head -1)"
          if [ -z "$db_container" ]; then
            echo "::error title=No database container::Could not find the local Postgres container."
            docker ps --format '{{.Names}}'
            exit 1
          fi
          psql() { docker exec -i "$db_container" psql -U postgres -d postgres -tAc "$1"; }

          # Count with the CLI's own migration-filename regex, not a glob: a stray helpers.sql
          # would otherwise fail this check with entirely the wrong diagnosis.
          expected="$(find supabase/migrations -maxdepth 1 -type f | grep -cE '/[0-9]+_.*\.sql$')"
          applied="$(psql 'select count(*) from supabase_migrations.schema_migrations')"
          echo "migrations: ${applied} applied, ${expected} in the repository."
          if [ "$applied" != "$expected" ]; then
            echo "::error title=Schema mismatch::${applied} migrations applied but ${expected} are in supabase/migrations. A fresh volume should apply them all; a partial apply means one aborted and everything after it is missing."
            exit 1
          fi

          # BOTH tables, not just control_events: 0003 publishes chat_submissions five migrations
          # earlier, so if the publication were missing, 0003 aborts and 0008 never runs at all.
          for table in chat_submissions control_events; do
            in_pub="$(psql "select count(*) from pg_publication_tables where pubname='supabase_realtime' and tablename='${table}'")"
            if [ "$in_pub" != "1" ]; then
              echo "::error title=${table} is not published::pg_publication_tables has no supabase_realtime entry for ${table}. The hosted-playout specs subscribe through postgres_changes and would fail as 30s timeouts that read like a renderer bug."
              exit 1
            fi
          done
          echo "supabase_realtime publishes chat_submissions and control_events."

      # The one thing a fresh database genuinely lacks: the account. 21 of the 33 tests sign in,
      # and without this every one of them fails at the sign-in assertion — twenty ambiguous UI
      # timeouts for a single missing row.
      #
      # Created through the admin API, then PROVED by authenticating. "The row exists" is weaker
      # than "these exact credentials work", and the password grant converts the whole class of
      # failure into one unambiguous step. A 422 (the user already exists) is tolerated so a
      # dispatch against a persisted stack is not a hard error.
      - name: Create the test account and prove it can sign in
        run: |
          set -euo pipefail
          create="$(curl -s -o /tmp/create.json -w '%{http_code}' \
            -X POST "${VITE_SUPABASE_URL}/auth/v1/admin/users" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${E2E_EMAIL}\",\"password\":\"${E2E_PASSWORD}\",\"email_confirm\":true}")"
          case "$create" in
            2*) echo "Account created." ;;
            422) echo "Account already existed - continuing." ;;
            *)  echo "::error title=Could not create the test account::admin/users answered ${create}."
                cat /tmp/create.json; exit 1 ;;
          esac

          # THE ASSERTION THAT MATTERS. Everything downstream depends on this exact pair working.
          token="$(curl -s -X POST "${VITE_SUPABASE_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${E2E_EMAIL}\",\"password\":\"${E2E_PASSWORD}\"}" | jq -r '.access_token // empty')"
          if [ -z "$token" ]; then
            echo "::error title=The test account cannot sign in::The password grant returned no access_token, so all 20 signed-in specs would fail at the sign-in step. This is an environment fault, not a regression."
            exit 1
          fi
          echo "Test account authenticates."

      # playwright.live.config.ts starts its own Vite dev server; the env exported above is what
      # puts the app in configured mode, signs the specs in, and gives api/ its server-side half.
      # `|| true` so a red suite still reaches the assertion below — the real exit code is
      # recovered from the report.
      - name: Configured E2E suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: configured-report.json
        run: npm run test:e2e:live -- --reporter=list,json || true

      # A green exit code from this suite means nothing on its own; only the counts do.
      - name: Assert the suite actually ran
        id: assert
        run: |
          set -uo pipefail
          if [ ! -f configured-report.json ]; then
            echo "::error title=No report::Playwright wrote no JSON report - the run never started."
            echo "green=false" >> "$GITHUB_OUTPUT"
            echo "summary=no JSON report - the run never started" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected=$(jq -r '.stats.expected // 0' configured-report.json)
          unexpected=$(jq -r '.stats.unexpected // 0' configured-report.json)
          flaky=$(jq -r '.stats.flaky // 0' configured-report.json)
          skipped=$(jq -r '.stats.skipped // 0' configured-report.json)
          ran=$((expected + unexpected + flaky))
          echo "Ran ${ran} tests (${expected} passed, ${unexpected} failed, ${flaky} flaky), ${skipped} skipped."

          {
            echo "### Configured suite — tests executed"
            echo ""
            echo "${ran} ran, ${skipped} skipped, ${unexpected} failed, ${flaky} flaky."
            echo ""
            # Read the RESULT status, not `.ok` - a skipped spec reports ok:true, which is the
            # very confusion this workflow exists to remove.
            jq -r '[.. | objects | select(has("specs")) | .specs[]]
                   | .[]
                   | "- `\(.file)` — \(.title): \([.tests[]?.results[]?.status] | last // "not run")"' \
              configured-report.json | sort
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          # WHICH spec skipped, not just how many.
          unexpected_skips="$(jq -r --arg allowed "$ALLOWED_SKIPS" '
            ($allowed | split(" ") | map(select(. != ""))) as $ok
            | [.. | objects | select(has("specs")) | .specs[]]
            | map(select(([.tests[]?.results[]?.status] | last) == "skipped"))
            | map(.file) | unique | map(select(. as $f | ($ok | index($f)) | not))
            | join(" ")' configured-report.json)"
          if [ -n "$unexpected_skips" ]; then
            echo "::error title=Unexpected skip::These spec files skipped:${unexpected_skips}. With a local stack nothing should skip - every credential and capability is present by construction, so a skip means the environment did not come up the way this job assumes."
            status=1
          fi
          if [ "$ran" -lt "$MIN_TESTS" ]; then
            echo "::error title=Too few tests ran::${ran} test(s) executed, expected at least ${MIN_TESTS}."
            status=1
          fi
          if [ "$unexpected" -ne 0 ] || [ "$flaky" -ne 0 ]; then
            echo "::error title=Configured suite is red::${unexpected} failed, ${flaky} flaky."
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi
          echo "summary=${ran} ran, ${skipped} skipped, ${unexpected} failed, ${flaky} flaky" >> "$GITHUB_OUTPUT"

      # Container logs are the difference between "the playout specs are red" and "realtime never
      # came up". Only on failure, and only the stack's own logs.
      - name: Supabase container logs (on failure)
        if: ${{ failure() || steps.assert.outputs.green != 'true' }}
        run: |
          for c in $(docker ps -a --filter 'name=supabase_' --format '{{.Names}}'); do
            echo "===== $c ====="
            docker logs --tail 60 "$c" 2>&1 || true
          done

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: configured-report
          path: |
            configured-report.json
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      # The rolling-issue pattern every alarm here follows (docs/DEPLOYMENT.md): one open issue,
      # one comment per newly red run, closed by the next green one.
      - name: File / update the rolling issue
        if: ${{ always() && steps.assert.outputs.green != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUMMARY: ${{ steps.assert.outputs.summary }}
        run: |
          TITLE="Configured (authenticated) E2E suite is red"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="$(printf 'The configured suite failed at %s.\n\n%s\n\nThis tier brings up a LOCAL Supabase stack on the runner, so it no longer depends on any hosted project or credential. What it can still go red for without a code fault: a Docker image pull, `supabase start` health checks, or a Supabase CLI change. The container logs are in the run; check those before bisecting.\n\nRun: %s' \
            "${{ github.sha }}" "${SUMMARY:-the stack or the account never came up - see the run log}" "$RUN_URL")"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "Still red. $BODY"
          fi

      - name: Close the rolling issue
        if: ${{ steps.assert.outputs.green == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Configured (authenticated) E2E suite is red"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Configured suite green again at ${{ github.sha }} (${{ steps.assert.outputs.summary }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Fail the run when the suite was not a clean verdict
        if: ${{ steps.assert.outputs.green != 'true' }}
        run: exit 1
