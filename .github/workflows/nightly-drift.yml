# NIGHTLY DRIFT - the belt against a SCHEDULED SWEEP THAT NEVER RUNS.
#
# Two schedules are watched here, one job each: nightly.yml and configured-suite.yml. One
# workflow because the question is identical - "did the thing that is supposed to happen every
# night actually happen" - and because an alarm living inside either of them could not fire on
# the night that one did not run.
#
# nightly.yml alarms when the sweep goes RED. Nothing alarmed when it did not happen at all,
# and that is the more dangerous of the two: a red nightly files an issue, while an absent one
# looks exactly like a healthy night. This repo has already paid for that shape once - twenty
# production deploys failed while the repo stayed green, because nothing watched for the
# ABSENCE of a thing (docs/DEPLOYMENT.md). deploy-verify grew the same belt for deployments;
# this is the nightly's.
#
# It is a separate workflow on purpose. A check that lived inside nightly.yml could not fire
# when the nightly did not, and one bolted onto deploy-verify would tie "did last night's
# sweep happen" to a workflow about production deployments.
#
# A REPEAT SAYS NOTHING NEW, so it is not said twice. Both alarms below keep the RED - a green
# run while a schedule is dead is precisely the silence this workflow exists to prevent, and no
# amount of inbox tidiness is worth reintroducing it. What is withheld is the repeat COMMENT: a
# run whose finding is identical to the one already at the bottom of the issue adds nothing, and
# GitHub mails a person for every comment. This is the amendment nightly.yml and
# configured-suite.yml have both carried since 2026-08-25 ("Report a repeat of the same
# configured-suite failure only once"); nightly-drift was the one alarm in the repo that never
# received it, and it is the one that repeats fastest - twice a day, every day, for as long as
# the condition holds.
#
# The identity of a finding here is the LATEST value: the newest watched run the check could
# find, or the literal `none`. That is the whole state - if it has not moved, nothing about the
# world has changed since the last comment. The cutoff is deliberately NOT part of it, because
# the cutoff moves on every run and would make every repeat look new. A finding that HAS moved
# always posts, and a hard failure of any other kind was never in scope here: this workflow's
# only verdict is "did it happen".
#
# Measured 2026-08-25: 61 GitHub emails reached the owner over the preceding four days, 26 of
# them issue traffic. The classification is in docs/VERIFICATION.md, "What a red run means, and
# what actually emails".
#
# GitHub's own scheduling is why the window is generous. Scheduled runs are delayed under load
# - this repo has been observed running a 23:43 cron at 01:11 - and can be dropped entirely.
# A 26-hour window therefore tolerates several hours of ordinary drift on a daily schedule and
# only alarms when a whole night is genuinely missing. TWO check slots for the same reason:
# one dropped slot must not be able to hide a missing nightly.

name: nightly-drift

on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # the failure step files/updates the rolling issue

# Shared: both watched schedules are DAILY, so both tolerate the same drift.
env:
  WINDOW_HOURS: '26'

jobs:
  drift:
    name: Did a nightly run?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ISSUE_TITLE: Nightly sweep has not run
    steps:
      - name: Look for a nightly inside the window
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d "${WINDOW_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          # Any run counts, whatever its conclusion: a RED nightly is the other alarm's job,
          # and this one must never double-report it. The question here is only "did it
          # happen". In-progress runs count too - a sweep that started IS a sweep.
          LATEST="$(gh run list --workflow=nightly.yml --limit 30 --json createdAt \
            --jq 'if length == 0 then "" else (max_by(.createdAt).createdAt) end')"
          echo "cutoff=${CUTOFF}  latest=${LATEST:-<none>}"
          # ISO-8601 UTC sorts lexicographically, so a string compare is a time compare.
          if [ -n "$LATEST" ] && [ "$LATEST" \> "$CUTOFF" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=${LATEST:-none}" >> "$GITHUB_OUTPUT"
          echo "cutoff=${CUTOFF}" >> "$GITHUB_OUTPUT"

      # The rolling-issue pattern every alarm here follows (docs/DEPLOYMENT.md): one open
      # issue, one comment per newly failing check, closed by the next healthy state - with the
      # repeat amendment described at the top of this file.
      - name: File / update the missing-nightly issue
        if: ${{ steps.check.outputs.ok == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.check.outputs.latest }}
          CUTOFF: ${{ steps.check.outputs.cutoff }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MARKER="nightly-drift-state: latest=${LATEST}"
          BODY="$(printf 'No nightly sweep has run since %s (window: last %s hours, cutoff %s).\n\nThe nightly is scheduled at 02:00 UTC. GitHub delays scheduled runs under load and can drop them, so a single late night is expected to close itself; a persistent one means the schedule is not firing and the whole exhaustive tier is silently absent.\n\nWhat to check: Actions -> nightly -> whether the schedule is disabled (GitHub disables schedules on repos with 60 days of inactivity), and whether .github/workflows/nightly.yml is still on the default branch.\n\nRun: %s\n\n<!-- %s -->' \
            "${LATEST}" "${WINDOW_HOURS}" "${CUTOFF}" "$RUN_URL" "$MARKER")"
          EXISTING="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
            exit 0
          fi
          # Withhold ONLY a repeat of the identical finding. `// .body` covers a freshly-created
          # issue that has no comments yet. The run still fails and the issue stays open.
          LAST="$(gh issue view "$EXISTING" --json comments,body --jq '(.comments | map(.body) | last) // .body')"
          if printf '%s' "$LAST" | grep -qF "$MARKER"; then
            echo "::notice title=Same finding already reported::${MARKER} is already the latest word on issue #${EXISTING}, so this run adds no comment. The run is still red."
            exit 0
          fi
          gh issue comment "$EXISTING" --body "Still missing. $BODY"

      - name: Close the missing-nightly issue
        if: ${{ steps.check.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          EXISTING="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "A nightly ran at ${LATEST}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Fail the run when the nightly is missing
        if: ${{ steps.check.outputs.ok == 'false' }}
        run: |
          echo "::error title=Nightly drift::No nightly sweep in the last ${WINDOW_HOURS} hours - see the rolling issue."
          exit 1

  # ── DID THE CONFIGURED SUITE RUN ON ITS OWN? ─────────────────────────────────────────────
  # configured-suite.yml is the only nightly verdict for the authenticated surfaces the
  # 2026-09-12 production is judged on (the four hosted-playout walks, account, community,
  # moderation, the Pro wizard). Its cron landed on main on 2026-08-24 and, as of 2026-08-25,
  # had never once produced a run: all 16 of its runs were workflow_dispatch.
  #
  # SCHEDULE RUNS ONLY, and that filter is the whole point. Sixteen manual dispatches made the
  # suite look thoroughly exercised while the signal it is supposed to BE had never fired, and
  # dispatching it by hand is exactly what masked that for two days. A dispatch proves the
  # specs pass; it can never prove the schedule works, so it must not close this alarm.
  configured:
    name: Did the configured suite run on its schedule?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ISSUE_TITLE: Configured suite is not running on its schedule
    steps:
      - name: Look for a SCHEDULED configured-suite run inside the window
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d "${WINDOW_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          # Any conclusion counts - a RED configured suite files its own rolling issue, and this
          # one must never double-report it. In-progress counts too: a suite that started ran.
          LATEST="$(gh run list --workflow=configured-suite.yml --event=schedule --limit 30 \
            --json createdAt --jq 'if length == 0 then "" else (max_by(.createdAt).createdAt) end')"
          echo "cutoff=${CUTOFF}  latest=${LATEST:-<none>}"
          # ISO-8601 UTC sorts lexicographically, so a string compare is a time compare.
          if [ -n "$LATEST" ] && [ "$LATEST" \> "$CUTOFF" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=${LATEST:-none}" >> "$GITHUB_OUTPUT"
          echo "cutoff=${CUTOFF}" >> "$GITHUB_OUTPUT"

      # The rolling-issue pattern every alarm here follows (docs/DEPLOYMENT.md): one open
      # issue, one comment per newly failing check, closed by the next healthy state - with the
      # repeat amendment described at the top of this file. This job is why that amendment was
      # written: it runs twice a day, and while a cron is dead its finding is the same sentence
      # every time. Issue #44 was filed on 2026-08-25 at 18:57 UTC and would otherwise have
      # collected an identical "Still missing." comment at 06:17 and 18:17 every day after it.
      - name: File / update the missing-schedule issue
        if: ${{ steps.check.outputs.ok == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.check.outputs.latest }}
          CUTOFF: ${{ steps.check.outputs.cutoff }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MARKER="configured-schedule-state: latest=${LATEST}"
          BODY="$(printf 'No SCHEDULED configured-suite run since %s (window: last %s hours, cutoff %s).\n\nOnly schedule runs count here. A workflow_dispatch proves the specs pass; it can never prove the cron fires, and dispatching by hand is what hid this for two days.\n\nThe suite is scheduled at 01:10 UTC. GitHub delays scheduled runs under load and can drop them, so a single missed cycle is expected to close itself; a persistent one means the authenticated surfaces - including the four hosted-playout walks - have no nightly verdict at all.\n\nWhat to check, cheapest first: `gh api repos/:owner/:repo/actions/workflows` and read this workflow state (a disabled_inactivity state ends it there); then that .github/workflows/configured-suite.yml is still on the default branch; then whether another run held the configured-suite concurrency group across the slot.\n\nRun: %s\n\n<!-- %s -->' \
            "${LATEST}" "${WINDOW_HOURS}" "${CUTOFF}" "$RUN_URL" "$MARKER")"
          EXISTING="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
            exit 0
          fi
          # Withhold ONLY a repeat of the identical finding. `// .body` covers a freshly-created
          # issue that has no comments yet. The run still fails and the issue stays open.
          LAST="$(gh issue view "$EXISTING" --json comments,body --jq '(.comments | map(.body) | last) // .body')"
          if printf '%s' "$LAST" | grep -qF "$MARKER"; then
            echo "::notice title=Same finding already reported::${MARKER} is already the latest word on issue #${EXISTING}, so this run adds no comment. The run is still red."
            exit 0
          fi
          gh issue comment "$EXISTING" --body "Still missing. $BODY"

      - name: Close the missing-schedule issue
        if: ${{ steps.check.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          EXISTING="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "The configured suite ran on its schedule at ${LATEST}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Fail the run when the schedule is not firing
        if: ${{ steps.check.outputs.ok == 'false' }}
        run: |
          echo "::error title=Configured-suite schedule::No SCHEDULED configured-suite run in the last ${WINDOW_HOURS} hours - see the rolling issue."
          exit 1
