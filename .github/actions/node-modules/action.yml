name: Install dependencies
description: >
  Restore node_modules from a cache keyed on the manifests and lockfiles, falling back to
  `npm ci`, so a slow npm registry cannot spend ten minutes of a job's budget.

# WHY THIS EXISTS: `npm ci` was the single largest cost in the E2E gate, and it was invisible.
#
# Measured over the 90 E2E shard jobs of the ten ci.yml runs from 2026-09-04 01:25 to 08:43,
# the `Install dependencies` step took a MEAN of 6.36 minutes, median 6.08, p90 10.07, against a
# 20-minute job cap. It is not workload - it is variance. Inside ONE run (33854844447), with the
# same lockfile and the same restored ~/.npm cache, shard 9 installed 304 packages in 8 seconds
# and shard 8 took 10 minutes for the same 304. The slow ones stall in npm's own registry
# traffic; the log's phrasing shows it, "added 304 packages, and audited 305 packages in 8s" on
# the fast runners against a bare "added 304 packages in 10m" on the slow ones.
#
# It was paid TWICE per job. The root package's `postinstall` runs
# `scripts/build-player-host.mjs`, which does a nested `npm ci` in player-host/ because that
# package's node_modules never exists on a fresh runner - another 1s-to-5min of the same
# lottery. On run 33854844447 five of the nine shards paid ~5 minutes for each half.
#
# That is what killed the gate. Shard 8 of that run: 10.05 min installing + 10.02 min testing =
# 20.27, killed at the cap. Shard 5: 10.07 + 9.95 = 20.30, killed at the cap. Both were carrying
# ~9.8 minutes of measured tests - well inside the budget the packer planned them for. The
# durations table was not wrong (it predicted those runs' test time to within 3%); the model
# around it simply had no term for this.
#
# WHAT THIS CHANGES: on a cache hit npm is not invoked at all, so the registry is not in the
# critical path of a capped job. On a miss it runs `npm ci` with the network work nothing here
# consumes turned off. There is one cache entry per manifest set rather than per run.
#
# The restore is fast, and that is measured rather than assumed: the sibling
# playwright-chromium action restores a 261 MB cache in 2.9 s on this runner class (run
# 33854844447, shard 8), and node_modules is ~433 MB before compression. A few seconds against a
# 6.4-minute mean is not a close call - and it is far more PREDICTABLE than npm, which is what a
# hard 20-minute cap actually needs.
#
# THE KEY IS THE SAFETY ARGUMENT. It hashes package.json as well as package-lock.json, root and
# player-host, because `npm ci` does one thing besides install: it REFUSES when the two disagree.
# Keying on the lockfile alone would mean a package.json edited without re-locking hits a cache
# entry and never gets that check. Hashing both means any manifest edit misses, `npm ci` runs,
# and the refusal still happens. The cost is one slow run per dependency change, which is rare.
#
# WHY NOT `actions/setup-node`'s own cache: that caches ~/.npm (the download cache), not
# node_modules, so npm still runs, still resolves, and still talks to the registry - which is
# exactly the step that takes ten minutes. Both are worth having; they cache different things.

runs:
  using: composite
  steps:
    # Native packages are built or downloaded per ABI, so the Node major version is part of what
    # the tree IS. Resolved rather than hardcoded, so a workflow that bumps `node-version` gets a
    # new key by construction instead of a subtly wrong tree.
    - name: Resolve Node version
      id: node
      shell: bash
      run: echo "major=$(node -p 'process.versions.node.split(".")[0]')" >> "$GITHUB_OUTPUT"

    - name: Cache node_modules
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          player-host/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.major }}-${{ hashFiles('package.json', 'package-lock.json', 'player-host/package.json', 'player-host/package-lock.json') }}

    # `--prefer-offline` uses the restored ~/.npm cache instead of revalidating every package
    # against the registry; `--no-audit` drops the advisory request, whose result nothing here
    # reads (the repo's dependency audit is weekly-audit.yml, which asks for it deliberately);
    # `--no-fund` is display only. None of them change WHAT is installed - the lockfile decides
    # that - so this remains the same tree `npm ci` has always produced.
    - name: npm ci
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund

    # A restored tree never ran npm's `postinstall`, and three build products that are gitignored
    # come from it: the per-checkout dev port, the generated video @font-face module, and
    # public/player-host/ (which the video specs load). Running it explicitly is what makes the
    # cache hit produce the same working tree as the install would have. It is cheap on a hit -
    # player-host/node_modules is restored with the rest, so build-player-host.mjs skips its
    # nested install and the vite build takes ~150 ms.
    - name: Regenerate install-time artifacts
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: npm run postinstall
