name: Set up Playwright Chromium
description: >
  Cache and install the Chromium Playwright drives, with the apt step bounded so a slow Ubuntu
  mirror can never take a job down with it.

# WHY THIS IS ONE ACTION AND NOT THREE COPIES OF FOUR STEPS.
#
# The E2E shards had a browser cache; Factory gates and the Catalog calibration gate did not,
# and re-downloaded ~170 MB and re-ran apt on every single run (measured at 62-88 s each on run
# 32232764872). Nobody decided that - the shard job grew a cache and its two siblings were never
# updated. Setup shared by three jobs belongs in one file, so the next improvement reaches all
# of them by construction.
#
# WHAT KEPT KILLING RUNS. `playwright install --with-deps` and `playwright install-deps` both
# run `apt-get update`, and the runner's mirrorlist leads with an azure.archive.ubuntu.com that
# regularly black-holes. apt logs `Ign:` with exponential backoff, falls back to
# archive.ubuntu.com, fetches the InRelease files - and then hangs silently. Measured on run
# 32226977556: 19 minutes 15 seconds of no output between the last `Get:` line and the job's own
# `timeout-minutes` firing. A timed-out job is reported as `cancelled`, which reads like somebody
# killed the run rather than like the infrastructure fault it is.
#
# It is not rare: 10 of the last 60 CI runs were cancelled, and every one that was sampled died
# on this step - several of them on `main`, where they file the rolling red-main issue against a
# commit that is fine. A full run does this eleven times over (nine shards plus the two gate
# jobs), and with `fail-fast: false` and no retries, one hang out of eleven reds the whole gate.
#
# So the apt call is bounded and non-fatal here. It is worth keeping rather than deleting:
# everything it installs today is fonts (fonts-freefont-ttf, fonts-ipafont-gothic,
# fonts-tlwg-loma-otf, fonts-unifont, fonts-wqy-zenhei, xfonts-*) - the runner image already
# carries every shared library Chromium needs - and nothing in this repo renders non-Latin text
# at present, but a template that does would want them, and the same call is the safety net if a
# future runner image ever does drop a library. Bounded, it can no longer end a run.
#
# What it must NOT do is cost three minutes on every job of every run for a set of fonts nothing
# reads. Since 2026-08-19 it is tied to the browser cache miss below - the moment a new browser
# could actually want a new library - and the step's own comment carries the measurement.

runs:
  using: composite
  steps:
    # Keyed on Playwright's own resolved version rather than a lockfile hash, so an unrelated
    # dependency bump does not throw away a browser that did not change.
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}

    # Deliberately NOT `--with-deps`: that flag runs apt inside the same process, so a mirror
    # stall would hang the browser download too and there would be nothing left to bound.
    - name: Install Playwright browser
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install chromium

    # RECONCILED WITH THE BROWSER, NOT ON EVERY RUN - this step is tied to the same cache miss
    # as the download above, and that is the single largest saving measured on this gate.
    #
    # It used to run cache hit or miss, on the argument that system packages come with the image
    # and want reconciling every time. Measured over the 60 CI runs to 2026-08-19, that argument
    # cost more than everything else on the critical path put together: on a cache HIT the whole
    # composite took 3.15 min, of which the cache restore was 3 s and apt was the other 3.1 -
    # and 3.1 min is what `timeout 180` cuts it off at, so the step was not even finishing. Nine
    # shards plus the factory and catalog jobs pay it in parallel, so it sat ~3 min deep in the
    # wall clock of every single run. Run 32281426013 is the control: apt happened to be fast
    # there, the composite took 0.93 min, and that run's slowest shard was 9.5 min against 11.9
    # and 12.0 on its neighbours.
    #
    # Skipping it on a cache hit is safe because of WHAT it installs, which the log names every
    # time: fonts-freefont-ttf, fonts-ipafont-gothic, fonts-tlwg-loma-otf, fonts-unifont,
    # fonts-wqy-zenhei and the xfonts-* set. Every shared library Chromium links against is
    # already in the runner image (apt reports fonts-liberation and fonts-noto-color-emoji as
    # "already the newest version"), nothing in this repo renders non-Latin text, and the 180 s
    # bound meant a DIFFERENT subset of those fonts landed on each runner anyway - so no gate can
    # have been depending on them without being flaky about it. The baselines they would move are
    # recorded on a Windows laptop that has none of them.
    #
    # A cache miss is exactly the moment the argument still holds: a new Playwright version is
    # being unpacked, and that is when a browser can want a library the image does not carry. So
    # the reconciliation happens then, bounded exactly as before.
    #
    # `timeout` + a status check rather than a step-level `timeout-minutes` / `continue-on-error`,
    # because composite actions support neither on their own steps. The effect is the one that
    # matters: a stalled mirror costs three minutes and a warning in the log instead of the
    # job's entire budget and a red gate. If Chromium really is missing something, Playwright
    # says so by name when it launches - a far clearer failure than a silent 20-minute hang.
    - name: Install Playwright system dependencies (bounded)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if timeout 180 npx playwright install-deps chromium; then
          echo "System dependencies reconciled."
        else
          status=$?
          if [ "$status" -eq 124 ]; then
            echo "::warning title=Playwright deps timed out::apt did not finish within 180s (a stalled Ubuntu mirror). Continuing - the runner image already carries Chromium's libraries, and this step only adds extra fonts."
          else
            echo "::warning title=Playwright deps failed::playwright install-deps exited ${status}. Continuing - see the action's comment for why this is non-fatal."
          fi
        fi
