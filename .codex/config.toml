# The root and nested AGENTS.md contracts intentionally carry detailed binding rules.
# Keep the full root-to-area instruction chain available in trusted Codex sessions.
#
# This number is a RATCHET: it only ever goes DOWN. Every session loads one of these chains
# before doing anything, so the cost is paid more often than for any other file in the tree, and
# the limit is the only thing that stops a chain growing back once it has been trimmed.
# scripts/check-shared-instructions.mjs measures every root-to-area chain against it and fails
# the build once a chain has less than 4 KB free - a RESERVE in bytes, not a percentage of this
# number, precisely because this number ratchets. Lowering it to bank headroom would make every
# chain's percentage worse without a byte being written, so a percentage gate would fight the
# ratchet; a byte reserve does not move when this number moves. The practical consequence for
# anyone editing here: this number may never come within 4 KB of the largest live chain, or the
# ratchet itself red-gates the build.
#
# Measured 2026-08-08, after the root contract was cut from 500 to 331 lines: the largest chain
# is the one ending at src/components/AGENTS.md, and the check itself reports it as 113,719 bytes
# (its own count is the authoritative one - measuring the files by hand gives a slightly smaller
# number, because line endings differ). Roughly 1.8 KB of growth to that area contract is in
# flight on a kit branch. Set to 120,000, which leaves about 4 KB of headroom once that lands.
# Before the root cut the same chain stood at about 124 KB, within 7 KB of failing the build, and
# nothing reported how close it was.
#
# To lower it again: run the check, read the largest chain off its own output, allow a little
# headroom, and only ever reduce.
# Raising it hides the problem it exists to surface - shorten a contract instead.
#
# Ratcheted 2026-08-26, after two splits took the two largest single sections out of files every
# session in their area loads: src/components/timeline/ (16 KB, from src/components/AGENTS.md)
# and src/ai/lite/ + src/ai/pro/ (14 KB and 17 KB, from src/ai/AGENTS.md). Nothing was shortened
# in either - the sections moved whole, into directories that hold the files they describe. The
# largest chain was src/ai/AGENTS.md at 107,750 bytes and is now src/components/wizard/AGENTS.md
# at 104,576, so 112,000 leaves about 7 KB of headroom.
#
# Splitting only pays when the sections go to DIFFERENT directories. One split moves the bytes
# from the parent into the child's own chain and the maximum does not move; two splits mean no
# single chain carries both.
#
# Ratcheted 2026-09-03, 120,000 -> 112,000 -> 110,000. Three earlier notes lived here, each
# explaining why the number could not move that day; all three said the same thing, that the
# wizard chain was the one tight chain and lowering the limit would take it below the headroom
# it already had. That is now answered. The root contract gave up 11,556 bytes - the repository map
# and the ten-page URL table to docs/ARCHITECTURE.md, the incident behind each git rule to
# docs/BRANCHING_AND_LANDING.md, and two verification rules back to docs/VERIFICATION.md, which
# already held their measurements. Every chain in the repo felt all of it, because the root file
# is the one all 52 load.
#
# src/components/wizard/AGENTS.md went from 111,635 bytes (365 free, 99.7%) to 100,079. The
# number is set by how much room THAT chain needs, since it is the only one anywhere near the
# limit: at 110,000 it keeps 9,921 bytes, and 2 KB of the gain is banked where it cannot leak
# back. 108,000 would have matched the ~7.4 KB margin the 2026-08-26 ratchet left, and was
# rejected for the wizard's sake rather than anyone else's - this row exists because that chain
# red-gates first, so it gets the margin.
#
# Do not read the second chain as safe. src/templates/importedDesign is 87,269 bytes, which at
# this limit is 731 bytes under the 80% warning, so it trips on the next small addition to
# src/templates/AGENTS.md - fourteen chains load that file. That is a question of when, not
# whether, at any limit in this range; 108,000 only makes it immediate. When it does trip, the
# fix is that file, not this number.
#
# It is still the binding chain, and the two things that would move it are unchanged. Its own
# 50 KB leaf is rule-dense and CURRENT - a staleness pass on 2026-09-03 checked every backticked
# path and symbol in it against the tree and found nothing gone - so there is no cut in it that
# does not lose a live rule. And it has no split: every file it describes sits in wizard/ or
# wizard/steps/, so a child contract would be loaded ON TOP of this one rather than instead of
# it. Moving those bytes needs a ruled deletion or a code reorganization, not editing.
project_doc_max_bytes = 110000
