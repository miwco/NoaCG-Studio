# The root and nested AGENTS.md contracts intentionally carry detailed binding rules.
# Keep the full root-to-area instruction chain available in trusted Codex sessions.
#
# This number is a RATCHET: it only ever goes DOWN. Every session loads one of these chains
# before doing anything, so the cost is paid more often than for any other file in the tree, and
# the limit is the only thing that stops a chain growing back once it has been trimmed.
# scripts/check-shared-instructions.mjs measures every root-to-area chain against it and fails
# the build when one is over.
#
# Measured 2026-08-08, after the root contract was cut from 500 to 331 lines: the largest chain
# is the one ending at src/components/AGENTS.md, and the check itself reports it as 113,719 bytes
# (its own count is the authoritative one - measuring the files by hand gives a slightly smaller
# number, because line endings differ). Roughly 1.8 KB of growth to that area contract is in
# flight on a kit branch. Set to 120,000, which leaves about 4 KB of headroom once that lands.
# Before the root cut the same chain stood at about 124 KB, within 7 KB of failing the build, and
# nothing reported how close it was.
#
# To lower it again: run the check, read the largest chain off its own output, allow a little
# headroom, and only ever reduce.
# Raising it hides the problem it exists to surface - shorten a contract instead.
#
# Ratcheted 2026-08-26, after two splits took the two largest single sections out of files every
# session in their area loads: src/components/timeline/ (16 KB, from src/components/AGENTS.md)
# and src/ai/lite/ + src/ai/pro/ (14 KB and 17 KB, from src/ai/AGENTS.md). Nothing was shortened
# in either - the sections moved whole, into directories that hold the files they describe. The
# largest chain was src/ai/AGENTS.md at 107,750 bytes and is now src/components/wizard/AGENTS.md
# at 104,576, so 112,000 leaves about 7 KB of headroom.
#
# Splitting only pays when the sections go to DIFFERENT directories. One split moves the bytes
# from the parent into the child's own chain and the maximum does not move; two splits mean no
# single chain carries both.
#
# NOT ratcheted 2026-08-29, deliberately. The coherence pass that day found the wizard chain with
# 25 bytes free - two sessions had already lost a build to it, and one shortened a PILLAR in the
# root contract to fit (4a9fb94e). Splitting the dialog anatomy out to src/styles/ and the monitor
# contract out to src/components/home/ took that chain to ~4.4 KB free. The limit still cannot
# move, because the tightest chain is now src/templates/importedDesign/AGENTS.md at ~1 KB free:
# src/templates/AGENTS.md is 67 KB and all fourteen category subdirectories load it. Lowering the
# limit now would only move the failure to those chains. The next split - its "Shared assemblers"
# and repeating-data sections going to the directories that own those files - is what buys the
# room to ratchet, and should be done before this number is touched.
#
# NOT ratcheted 2026-08-30 either, and this is now the ceiling rather than a postponement.
# That split happened: the logo-slot measurement record left src/templates/AGENTS.md for
# docs/LOGO_SLOT.md (-8.9 KB, felt by all fourteen category chains), and the root contract's
# production-migration bullet collapsed onto supabase/AGENTS.md, which already owned it
# (-1.2 KB, felt by all 38). importedDesign went from ~1.5 KB free to ~10.9 KB, and every
# template chain now has at least 10 KB.
#
# The limit still cannot move, and the reason has changed. The ONE tight chain left is
# src/components/wizard/AGENTS.md at 107,712 bytes, 4,288 free - and lowering the limit to
# capture the reclaimed room would take that chain BELOW the headroom it had this morning,
# which is the failure this ratchet is supposed to prevent, not cause. So the number stays.
#
# What would move it, and why it is not a byte-golf job: the wizard chain is root (32 KB) +
# src/components (26 KB) + src/components/wizard (48 KB), and NONE of the three has a section
# whose code lives in a subdirectory it could follow. The panel components sit directly in
# src/components/, AiStep.tsx sits directly in steps/ (only MoreControlPanel and UploadCard are
# in steps/ai/), and the SVG-import steps are all in steps/ too - so every candidate split is
# parent-to-same-child, which moves the bytes and not the maximum. The honest move is the one
# done here twice: find a section that is MEASUREMENT rather than rule, and send it to a doc,
# which is in no chain at all. Do that once in the wizard contract for ~6 KB and this number
# can go to 105,000.
project_doc_max_bytes = 112000
