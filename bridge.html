<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- THE BRIDGE (docs/AGENT_CLI.md): the platform's headless surface for the `noacg` CLI and
         MCP server. A driver opens this page in its own browser, waits for window.noacgBridge,
         and calls the platform's own scaffold / validate / bench / package functions on graphics
         an external coding agent wrote. Nothing here is for people: no account, no key, no data
         of its own - it is noindex and out of the sitemap on purpose. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>NoaCG bridge</title>
    <style>
      :root { --bg: #0a0c10; --text: #e8eaf0; --text-dim: #aab0bf; --accent: #f6a623; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
      main { max-width: 52rem; padding: 2rem 1.5rem; line-height: 1.5; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      #status { color: var(--accent); font-family: ui-monospace, monospace; }
      p { color: var(--text-dim); }
      code { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>NoaCG bridge</h1>
      <p id="status">Loading…</p>
      <p>
        This page is driven by the <code>noacg</code> command-line tool and MCP server. It validates,
        benches and packages broadcast graphics on request, using the same code the studio runs.
        There is nothing to do here by hand - open <a href="/app">the studio</a> instead.
      </p>
    </main>
    <script type="module" src="/src/bridge/main.ts"></script>
  </body>
</html>
